  }
  if(kind==="plan"){
    const ps=(c.plans||[]).map(normPlan).slice().sort((a,b)=>b.from.localeCompare(a.from));
    const cur=planFor(S.month);
    openSheet(sheetShell("按分と拠出", `
      <div class="note">按分の割合が効くのは<b>この固定額だけ</b>でござる。ここから足が出た共有の支払いは<b>折半</b>。
      按分の外で上乗せしているもの（共有カード払いの個人保険など）は「上乗せ」に入れてくだされ。</div>
      ${(cur.extra.r||cur.extra.m)
        ? `<div class="note">上乗せの相殺は<b>カード明細の取り込み</b>が担い申す。
           「個人の負担に倒す店」に入っている店は、取り込んだ折に自動でその人の負担になり申す。
           <b>固定費に同じものを入れてはなり申さぬ</b> ―― 二重に数えて精算が狂い申す。</div>` : ""}
      <div class="flabel">${ymLabel(S.month)} に効いている決め事</div>
      <div class="field"><label>按分する固定額（二人合わせて）</label><input id="p-base" type="tel" inputmode="numeric" value="${yenPlain(cur.base)}"></div>
      <div class="field"><label>${esc(c.names.r)} の割合（％）</label><input id="p-ratio" type="tel" inputmode="numeric" value="${Math.round(cur.ratio*1000)/10}"></div>
      <div class="field"><label>${esc(c.names.r)} の上乗せ（保険など・無ければ0）</label><input id="p-er" type="tel" inputmode="numeric" value="${yenPlain(cur.extra.r)}"></div>
      <div class="field"><label>${esc(c.names.m)} の上乗せ（無ければ0）</label><input id="p-em" type="tel" inputmode="numeric" value="${yenPlain(cur.extra.m)}"></div>
      <div class="warnbox" id="p-calc"></div>
      <button class="save" id="p-save">この期を直す</button>
      <button class="save ghost" id="p-new">${ymLabel(S.month)}から新しい期を始める</button>
      <div class="flabel" style="margin-top:22px">これまでの期</div>
      ${ps.map(p=>{ const cb=contribOf(p); return `<div class="setrow"><div><div class="sl num">${ymLabel(p.from)} から</div>
        <div class="sd num">${yenPlain(p.base)} を ${Math.round(p.ratio*100)}：${100-Math.round(p.ratio*100)}${p.extra.r||p.extra.m?"＋上乗せ":""}
        → ${yenPlain(cb.r)} / ${yenPlain(cb.m)}</div></div>
        ${ps.length>1?`<button class="mini ghost" data-pdel="${esc(p.from)}">消す</button>`:""}</div>`; }).join("")}
      <div class="note">割合は年に一度ほど見直すものと承ってござる。変えるときは<b>「新しい期を始める」</b>を押されよ ――
      いま開いている月から先だけが変わり、過去の精算は動き申さぬ。</div>
      `), {kind:"plan", from:cur.from});
  }
  if(kind==="fixed"){
    const p=planFor(S.month);
    openSheet(sheetShell("固定費（"+ymLabel(p.from)+"から）", `
      <div id="fx-list">${(p.fixed||[]).map((f,i)=>`
        <div class="setrow"><div><div class="sl">${esc(f.name)}</div>
          <div class="sd num">${yen(f.amount)}・${esc(f.cat)}・${esc(payerLabel(f.payer))}から・${esc(burdenLabel(f.burden))}の分</div></div>
          <button class="mini ghost" data-fxdel="${i}">消す</button></div>`).join("")
        || '<div class="empty"><span class="e-ic">📅</span>まだ無し</div>'}</div>
      <div class="note">毎月かならず出ていくものを入れておくと、ひとりでに数え上げ申す。<b>共有カードで払っている個人の保険</b>のようなものは、払う元を「共有カード」・誰の分かを「個人」にすると正しく精算されるでござる。</div>
      <div class="field"><label>名前</label><input id="fx-name" placeholder="家賃"></div>
      <div class="field"><label>金額</label><input id="fx-amt" type="tel" inputmode="numeric" placeholder="133330"></div>
      <div class="field"><label>費目</label><select id="fx-cat">${CATS.map(x=>`<option ${x.k==="住居"?"selected":""}>${esc(x.k)}</option>`).join("")}</select></div>
      <div class="field"><label>どこから払うか</label><select id="fx-payer">${PAYERS().map(o=>`<option value="${o.k}">${esc(o.label)}</option>`).join("")}</select></div>
      <div class="field"><label>誰の分か</label><select id="fx-burden">${BURDENS().map(o=>`<option value="${o.k}">${esc(o.label)}</option>`).join("")}</select></div>
      <button class="save" id="fx-add">足す</button>`), {kind:"fixed", from:p.from});
  }
  if(kind==="mine"){
    const who=k=>esc(k==="r"?c.names.r:c.names.m);
    openSheet(sheetShell("個人の負担に倒す店", `
      <div class="note">共有カードで払ってはいるが、<b>共有すべきでない個人の支出</b>の店。
      明細を取り込んだ折に、この言葉が店名に含まれていれば自動でその人の負担になり申す。
      旧Excelで負の数を書いていたものが、これにあたる。</div>
      <div class="warnbox">上乗せを入れておられるなら、<b>それに見合う額がここで倒れるようにしておくこと。</b>
      倒れぬと、貸し借りの無い月にも上乗せの半分が精算として出てしまい申す。</div>
      <div id="mn-list">${(c.mine||[]).map((d,i)=>`
        <div class="setrow"><div><div class="sl">${esc(d.kw)}</div><div class="sd">${who(d.who)}の負担</div></div>
        <button class="mini ghost" data-mndel="${i}">消す</button></div>`).join("")}</div>
      <div class="field"><label>言葉</label><input id="mn-kw" placeholder="ＡＦ戸越公園"></div>
      <div class="field"><label>誰の負担か</label><select id="mn-who">
        <option value="r">${esc(c.names.r)}</option><option value="m">${esc(c.names.m)}</option></select></div>
      <button class="save" id="mn-add">足す</button>`), {kind:"mine"});
  }
  if(kind==="dict"){
    openSheet(sheetShell("店名の振り分け", `
      <div class="note">この言葉が店名に含まれていたら、その費目と見立て申す。手で入れた店も覚えてゆく。</div>
      <div id="dc-list">${(c.dict||[]).map((d,i)=>`
        <div class="setrow"><div><div class="sl">${esc(d.kw)}</div><div class="sd">${esc(d.cat)}</div></div>
        <button class="mini ghost" data-dcdel="${i}">消す</button></div>`).join("")}</div>
      <div class="field"><label>言葉</label><input id="dc-kw" placeholder="マルエツ"></div>
      <div class="field"><label>費目</label><select id="dc-cat">${CATS.map(x=>`<option>${esc(x.k)}</option>`).join("")}</select></div>
      <button class="save" id="dc-add">足す</button>`), {kind:"dict"});
  }
  /* 月を締める ―― 「振り込んだ」という出来事を刻む（2026-08-21 上様の指図により追加）
     押した折の振込額をそのまま控え、その月に乗っていた記録には精算月を刻んで凍らせる。
     ⚠ 以後この月の額は**算し直さない。** 按分比を後から直しても、動いた金は動かぬゆえ。 */
  /* 貸し借りの清算（2026-08-21 追加）
     残高ぶんを**逆向きの貸借として1本立てる。** 消しはせぬ ―― いつ幾ら清算したかが残るように。 */
  if(kind==="clear"){
    const bal=loanBalance(), N=c.names;
    const from = bal>0 ? N.m : N.r, to = bal>0 ? N.r : N.m;
    openSheet(sheetShell("貸し借りを清算する", `
      <div class="note">いまの残高は <b>${esc(from)} → ${esc(to)} ${yen(Math.abs(bal))}</b> にござる。
      これを直に渡し終えたら清算してくだされ。<b>逆向きの記録を1本立てて残高を0に戻し申す</b>
      ―― 消さぬのは、いつ幾ら清算したかを残すためでござる。</div>
      <div class="warnbox">これは<b>共有口座への振込とは別のやり取り</b>にござる。
      口座の勘定には一切触れ申さぬ。</div>
      <div class="field"><label>渡した日</label><input id="cr-on" type="date" value="${esc(today())}"></div>
      <button class="save" id="cr-go">${esc(from)} → ${esc(to)} ${yen(Math.abs(bal))} で清算する</button>`), {kind:"clear", bal});
  }
  if(kind==="settle"){
    const cl=Object.keys(c.closed||{}).sort().reverse();
    openSheet(sheetShell("精算日", `
      <div class="note">二人が共有口座へ振り込む日にござる。カードの引き落としは<b>26日</b>ゆえ、
      それより前に入れておく段取り。<b>この日を過ぎると「締める」の札が濃く出申す。</b></div>
      <div class="field"><label>毎月何日か</label><input id="st-day" type="tel" inputmode="numeric" value="${settleDay()}"></div>
      <div class="note">⚠ これは<b>見込みにすぎ申さぬ。</b>真は「精算した」を押した記録のほう。
      この日より後に自分の財布から立て替えたものは、翌月の精算へ回り申す。</div>
      <button class="save" id="st-save">変える</button>
      ${cl.length?`<div class="flabel" style="margin-top:22px">締めた月</div>
        ${cl.map(k=>{ const d=c.closed[k]; return `<div class="setrow"><div><div class="sl num">${ymLabel(k)}</div>
          <div class="sd num">${esc(String(d.on||"").replace(/-/g,"/"))} に締め・${esc(c.names.r)} ${yenPlain(d.r||0)} ／ ${esc(c.names.m)} ${yenPlain(d.m||0)}</div></div></div>`;
          }).join("")}
        <div class="note">締めを解くには、その月を開いて 🏦 の札から「締めを解く」を押されよ。</div>`:""}`), {kind:"settle"});
  }
  if(kind==="close"){
    const m=S.month, t=transfer(m), N=c.names;
    const pin=t.list.filter(x=>!x.fixed && !normYM(x.pay));   // 精算月を刻む相手
    openSheet(sheetShell(ymLabel(m)+"の精算を締める", `
      <div class="note">この月ぶんを<b>共有口座へ振り込んだ</b>ら締めてくだされ。
      締めると額が控えとして残り、<b>あとから按分や固定費を直しても動き申さぬ。</b>
      以後に足した記録は、次の精算へひとりでに回り申す。</div>
      <div class="sumrow"><span>${esc(N.r)} が振り込む</span><b class="num">${yen(Math.max(0,t.send.r))}</b></div>
      <div class="sumrow"><span>${esc(N.m)} が振り込む</span><b class="num">${yen(Math.max(0,t.send.m))}</b></div>
      <div class="sumrow big"><span>26日に口座から出る</span><b class="num">${yen(t.out)}</b></div>
      <div class="note num">この精算に乗っているのは <b>${t.list.filter(x=>!x.fixed).length}件</b>
        （うち <b>${pin.length}件</b>に精算月を刻んで凍らせ申す）＋ 固定費。</div>
      <div class="field"><label>振り込んだ日</label><input id="cl-on" type="date" value="${esc(today())}"></div>
      <button class="save" id="cl-go">この額で締める</button>`), {kind:"close", m});
  }
  if(kind==="reopen"){
    const m=S.month, d=closedOf(m)||{}, N=c.names;
    openSheet(sheetShell(ymLabel(m)+"の締めを解く", `
      <div class="warnbox">締めを解くと、この月の振込額は<b>いまの決め事で算し直され申す。</b>
      ${esc(String(d.on||"").replace(/-/g,"/"))} に控えた
      <b>${esc(N.r)} ${yen(d.r||0)}／${esc(N.m)} ${yen(d.m||0)}</b> は失われ申す。</div>
      <div class="note">記録に刻んだ精算月は<b>そのまま残し申す。</b>
      解いたあと締め直しても、同じ記録が同じ月に乗るようにするためでござる。
      どうしても動かしたい記録があれば、その記録を開いて「精算する月」を直してくだされ。</div>
      <button class="save del" id="ro-go">締めを解く</button>`), {kind:"reopen", m});
  }
  /* 引落月の振り直し（2026-08-20 追加）
     共有カードは月末締め・翌月26日払いゆえ、引落月＝**利用月の翌月**で一意に決まる。
     ⚠ 当て直すのは「共有カード払い・CSVから取り込んだ・引落月を持たぬ」ものだけ。
       手で入れた記録や、既に引落月を持つものには触れぬ。 */
  if(kind==="fixpay"){
    const bad=needPay(), byM={};
    bad.forEach(x=>{ const k=String(x.date).slice(0,7); (byM[k]=byM[k]||[]).push(x); });
    const keys=Object.keys(byM).sort();
    openSheet(sheetShell("引落月を振り直す", `
      <div class="note">共有カードは<b>月末締め・翌月26日払い</b>にござる。
      取り込んだ明細に引落月が入っておらぬと、振込の札が出ぬまま
      「明細がまだ1件もござらぬ」と鳴り続け申す。ここで<b>利用月の翌月</b>を当て直せまする。</div>
      ${keys.length ? keys.map(k=>{
        const sum=byM[k].reduce((a,b)=>a+(Number(b.amount)||0),0);
        return `<div class="setrow"><div><div class="sl num">${ymLabel(k)}利用・${byM[k].length}件</div>
          <div class="sd num">${yen(sum)} → <b>${ymLabel(shiftMonth(k,1))}</b>引落へ</div></div></div>`;
        }).join("")
      : `<div class="empty"><span class="e-ic">✅</span>引落月の抜けはござらぬ</div>`}
      ${keys.length?`<button class="save" id="fp-go">${bad.length}件に振り直す</button>`:""}`), {kind:"fixpay"});
  }
}

function bindConfigSheet(root){
  const c=S.cfg;
  const num = el => Number(String(el.value).replace(/[^0-9.]/g,""))||0;

  const sv=root.querySelector("#c-save");
  if(sv) sv.onclick=async ()=>{
    const k=sheetCtx.kind;
    if(k==="conn"){
      c.api=root.querySelector("#c-api").value.trim().replace(/\/exec.*$/,"/exec");
      c.token=root.querySelector("#c-token").value.trim();
      save("cfg",c); closeSheet(); toast("繋ぎにゆき申す"); await pullAll();
      toast(S.online?"繋がり申した":"繋がらず："+S.err); return;
    }
    if(k==="names"){
      c.names.r=root.querySelector("#c-n1").value.trim()||"諒";
      c.names.m=root.querySelector("#c-n2").value.trim()||"万貴";
    }
    saveCfg(); closeSheet(); render(); toast("変え申した");
  };

  const readPlan = ()=>({
    base: num(root.querySelector("#p-base")),
    ratio: Math.min(100,Math.max(0,num(root.querySelector("#p-ratio"))))/100,
    extra:{ r:num(root.querySelector("#p-er")), m:num(root.querySelector("#p-em")) }
  });
  const calc=root.querySelector("#p-calc");
  if(calc){
    const show=()=>{
      const v=readPlan(), cb=contribOf(v);
      calc.innerHTML = `毎月 共有の財布へ入れる額 ―― <b>${esc(c.names.r)} ${yen(cb.r)}</b>／<b>${esc(c.names.m)} ${yen(cb.m)}</b>`;
    };
    ["p-base","p-ratio","p-er","p-em"].forEach(id=>{ const el=root.querySelector("#"+id); if(el) el.oninput=show; });
    show();
  }
  const psv=root.querySelector("#p-save");
  if(psv) psv.onclick=()=>{
    const v=readPlan(), p=c.plans.map(normPlan).find(x=>x.from===sheetCtx.from);
    if(p){ p.base=v.base; p.ratio=v.ratio; p.extra=v.extra; }
    saveCfg(); closeSheet(); render(); toast("直し申した");
  };
  const pnew=root.querySelector("#p-new");
  if(pnew) pnew.onclick=()=>{
    const v=readPlan(), src=planFor(S.month);
    const exist=c.plans.map(normPlan).find(x=>x.from===S.month);
    if(exist){ exist.base=v.base; exist.ratio=v.ratio; exist.extra=v.extra; }
    else c.plans.push({from:S.month, base:v.base, ratio:v.ratio, extra:v.extra, fixed:structuredClone(src.fixed||[])});
    saveCfg(); closeSheet(); render(); toast(ymLabel(S.month)+"から新しい期にいたした");
  };
  root.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{
    c.plans=c.plans.filter(x=>x.from!==b.dataset.pdel);
    saveCfg(); openConfig("plan"); render();
  });

  /* 締める ―― 額を控え、乗っている記録に精算月を刻む。
     ⚠ 刻むのは `pay` を持たぬものだけ。取り込んだカード明細は既に請求月を持っている。 */
  const crg=root.querySelector("#cr-go");
  if(crg) crg.onclick=async ()=>{
    const bal=sheetCtx.bal, on=(root.querySelector("#cr-on")||{}).value||today();
    if(!bal){ closeSheet(); return; }
    closeSheet();
    await pushItem("add", { id:uid(), date:on, cat:"その他", amount:Math.abs(bal),
      payer: bal>0?"m":"r", burden: bal>0?"r":"m",       // 逆向きに立てる
      shop:"貸し借りの清算", memo:"", src:"手入力", kind:"貸借" });
    toast("清算いたした");
  };

  const stv=root.querySelector("#st-save");
  if(stv) stv.onclick=()=>{
    const d=Math.min(28,Math.max(1,num(root.querySelector("#st-day"))||20));
    c.settleDay=d; saveCfg(); closeSheet(); render(); toast("毎月"+d+"日に改め申した");
  };

  const clg=root.querySelector("#cl-go");
  if(clg) clg.onclick=async ()=>{
    const m=sheetCtx.m, t=transfer(m);
    const pin=t.list.filter(x=>!x.fixed && !normYM(x.pay)).map(x=>Object.assign({},x,{pay:m}));
    const on=(root.querySelector("#cl-on")||{}).value||today();
    closeSheet();
    if(pin.length) await pushMany("update", pin);
    c.closed=Object.assign({}, c.closed||{}, {[m]:{
      on, r:Math.max(0,t.send.r), m:Math.max(0,t.send.m), out:Math.round(t.out), n:t.list.filter(x=>!x.fixed).length}});
    saveCfg(); render(); toast(ymLabel(m)+"の精算を締め申した");
  };
  const rog=root.querySelector("#ro-go");
  if(rog) rog.onclick=()=>{
    const m=sheetCtx.m, nx=Object.assign({}, c.closed||{});
    delete nx[m]; c.closed=nx;
    saveCfg(); closeSheet(); render(); toast(ymLabel(m)+"の締めを解き申した");
  };

  const fpg=root.querySelector("#fp-go");
  if(fpg) fpg.onclick=async ()=>{
    const bad=needPay(); closeSheet();
    for(const x of bad) await pushItem("update", Object.assign({}, x,
      {pay: shiftMonth(String(x.date).slice(0,7), 1)}));
    render(); toast(bad.length+"件の引落月を振り直し申した");
  };

  const fxa=root.querySelector("#fx-add");
  if(fxa) fxa.onclick=()=>{
    const name=root.querySelector("#fx-name").value.trim();
    const amt=num(root.querySelector("#fx-amt"));
    if(!name||!amt){ toast("名前と金額を入れてくだされ"); return; }
    const p=c.plans.map(normPlan).find(x=>x.from===sheetCtx.from);
    (p.fixed=p.fixed||[]).push({name,amount:amt,cat:root.querySelector("#fx-cat").value,
      payer:root.querySelector("#fx-payer").value, burden:root.querySelector("#fx-burden").value, on:true});
    saveCfg(); closeSheet(); render(); toast("足し申した");
  };
  root.querySelectorAll("[data-fxdel]").forEach(b=>b.onclick=()=>{
    const p=c.plans.map(normPlan).find(x=>x.from===sheetCtx.from);
    p.fixed.splice(Number(b.dataset.fxdel),1);
    saveCfg(); openConfig("fixed"); render();
  });

  const mna=root.querySelector("#mn-add");
  if(mna) mna.onclick=()=>{
    const kw=root.querySelector("#mn-kw").value.trim();
    if(!kw){ toast("言葉を入れてくだされ"); return; }
    (c.mine=c.mine||[]).push({kw,who:root.querySelector("#mn-who").value});
    saveCfg(); openConfig("mine"); toast("覚え申した");
  };
  root.querySelectorAll("[data-mndel]").forEach(b=>b.onclick=()=>{
    c.mine.splice(Number(b.dataset.mndel),1); saveCfg(); openConfig("mine");
  });
  const dca=root.querySelector("#dc-add");
  if(dca) dca.onclick=()=>{
    const kw=root.querySelector("#dc-kw").value.trim();
    if(!kw){ toast("言葉を入れてくだされ"); return; }
    c.dict.push({kw,cat:root.querySelector("#dc-cat").value});
    saveCfg(); openConfig("dict"); toast("覚え申した");
  };
  root.querySelectorAll("[data-dcdel]").forEach(b=>b.onclick=()=>{
    c.dict.splice(Number(b.dataset.dcdel),1); saveCfg(); openConfig("dict");
  });
}

/* ---------- レシート取り込み ---------- */

function openReceipt(){
  openSheet(sheetShell("レシートを撮る", `
    <div class="note">レシートを1枚まるごと写してくだされ。日付・店名・合計を読み取り、入力の画面に載せ申す。
    カード明細に同じ買い物がすでに入っておれば、その場でお知らせいたす。</div>
    ${S.cfg.api?"":'<div class="warnbox">スプレッドシートに繋いでおらぬため、この機能は使えませぬ。先に「データの置き場」を設定してくだされ。</div>'}
    <div class="field"><label>レシートの写真</label><input id="rc-file" type="file" accept="image/*" capture="environment" ${S.cfg.api?"":"disabled"}></div>
    <div id="rc-body"></div>`), {kind:"receipt"});
}

// 写真は長辺1600pxまで縮める。原寸のままだと送るのに時間がかかり、読み取りの精度も上がらぬ。
function shrinkImage(file, maxEdge){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error("写真が読めず"));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("写真が開けず"));
      img.onload=()=>{
        const sc=Math.min(1, maxEdge/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const url=cv.toDataURL("image/jpeg",0.82);
        resolve({dataUrl:url, base64:url.split(",")[1]});
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function bindReceiptSheet(root){
  const f=root.querySelector("#rc-file");
  if(!f) return;
  f.onchange=async ()=>{
    const file=f.files[0]; if(!file) return;
    const body=document.getElementById("rc-body");
    body.innerHTML=`<div class="note"><span class="spin"></span>写真を整えており申す…</div>`;
    let img;
    try{ img=await shrinkImage(file, 1600); }
    catch(e){ body.innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; return; }

    body.innerHTML=`<img class="thumb" src="${img.dataUrl}" alt="">
      <div class="note"><span class="spin"></span>読み取っており申す。しばしお待ちを…</div>`;
    try{
      const j=await api("receipt", {image:img.base64, mime:"image/jpeg"});
      const r=j.receipt||{};
      const amount=Number(r.total)||0;
      if(!amount) throw new Error("合計が読み取れ申さず");
      const it={ id:"", date:r.date||today(), cat:guessCat(r.shop)||"食費",
                 amount, payer:"c", burden:"share", shop:r.shop||"",
                 memo:(r.items||[]).slice(0,4).map(x=>x.name).filter(Boolean).join("・") };
      const dup=findDup(it, S.items);
      const warn = dup
        ? `<div class="warnbox">同じ買い物がすでに入っておるやもしれませぬ ――
             <b>${esc(dup.shop||dup.cat)} ${yen(dup.amount)}（${esc(dup.date)}）</b>。
             重ねて入れると二重に数えられ申す。閉じるか、金額を確かめてくだされ。</div>`
        : "";
      closeSheet();
      setTimeout(()=>openEditor(it, {warn, src:"レシート"}), 260);
      if(!dup) toast("読み取り申した");
    }catch(e){
      body.innerHTML=`<div class="warnbox">読み取れ申さず：${esc(e.message)}</div>
        <div class="note">明るいところで、レシート全体が入るように撮り直してくだされ。それでも駄目なら ＋ から手で入れられ申す。</div>`;
    }
  };
}

/* ---------- CSV取り込み ---------- */

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(ch!=="\r") cell+=ch;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

function openCsv(){
  openSheet(sheetShell("カード明細を取り込む", `
    <div class="note">Vpass（パソコン）で明細を開き「CSV形式で保存する」で落としたファイルを選んでくだされ。
    どの列が何かは、この後この画面で選び申す。一度選べば次から覚えており申す。
    取り込んだ分はすべて<b>共有カード払い・共有の負担</b>として入り申すゆえ、個人のものは後から履歴で振り分けてくだされ。</div>
    <div class="field"><label>CSVファイル</label><input id="cv-file" type="file" accept=".csv,text/csv"></div>
    <div id="cv-body"></div>`), {kind:"csv"});
}

function bindCsvSheet(root){
  const f=root.querySelector("#cv-file");
  if(!f) return;
  f.onchange=()=>{
    const file=f.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const txt=rd.result;
      if(/�/.test(txt.slice(0,400))){      // 化けを見て読み直す(Shift_JISで落ちてくることが多い)
        const rd2=new FileReader();
        rd2.onload=()=>showCsvMap(parseCSV(rd2.result));
        rd2.readAsText(file,"Shift_JIS");
        return;
      }
      showCsvMap(parseCSV(txt));
    };
    rd.readAsText(file,"UTF-8");
  };
}

function showCsvMap(rows){
  if(!rows.length){ toast("中身が読めず"); return; }
  const width=Math.max(...rows.map(r=>r.length));
  const head=rows[0], saved=S.cfg.csvMap||{};
  const colOpts=sel=>Array.from({length:width},(_,i)=>
    `<option value="${i}" ${String(saved[sel])===String(i)?"selected":""}>${i+1}列目：${esc(String(head[i]||"").slice(0,12))}</option>`).join("");

  document.getElementById("cv-body").innerHTML=`
    <div class="scroller"><table class="csv"><tbody>${rows.slice(0,4).map(r=>
      `<tr>${Array.from({length:width},(_,i)=>`<td>${esc(String(r[i]||"").slice(0,14))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="flabel">どの列が何か</div>
    <div class="maprow"><span class="mk">日付</span><select id="m-date">${colOpts("date")}</select></div>
    <div class="maprow"><span class="mk">店名</span><select id="m-shop">${colOpts("shop")}</select></div>
    <div class="maprow"><span class="mk">金額</span><select id="m-amt">${colOpts("amt")}</select></div>
    <div class="maprow"><span class="mk">飛ばす行</span><select id="m-skip">
      ${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${String(saved.skip)===String(n)?"selected":""}>先頭 ${n} 行</option>`).join("")}</select></div>
    <div class="flabel">いつ共有口座から引き落とされる分か</div>
    <div class="maprow"><span class="mk">引落月</span><input id="m-pay" type="month" value="${guessPay(rows)}"></div>
    <div class="note">明細に載っている<b>利用日</b>と、口座から<b>出ていく日</b>はひと月ずれ申す（毎月26日引落）。
    振込額はこの引落月で数え申すゆえ、ここを違えると振込が合わなくなり申す。
    <b>Vpassで開いていた「◯年◯月お支払い分」と同じ月</b>を選んでくだされ。</div>
    <div id="cv-prev"></div>
    <button class="save" id="cv-go">取り込む</button>`;

  const readMap=()=>({
    date:Number(document.getElementById("m-date").value),
    shop:Number(document.getElementById("m-shop").value),
    amt:Number(document.getElementById("m-amt").value),
    skip:Number(document.getElementById("m-skip").value),
    pay:String(document.getElementById("m-pay").value||"")
  });
  const refresh=()=>{
    const list=csvToItems(rows,readMap());
    const fresh=list.filter(x=>!findDup(x,S.items));
    const sum=fresh.reduce((a,b)=>a+b.amount,0);
    /* ⚠ 見張り ―― 取り込む行が、その月の固定費と同じものを指していないか。
       ジムや保険を固定費にも入れたままだと二重に数え、精算が狂う（2026-08-18 に踏んだ）。 */
    const clash=[]; const seen={};
    fresh.forEach(x=>{
      const m=String(x.date).slice(0,7);
      (seen[m]=seen[m]||fixedFor(m)).forEach(f=>{
        if(f.payer==="c" && Number(f.amount)===Number(x.amount) && !clash.some(v=>v.f===f.shop))
          clash.push({f:f.shop, s:x.shop});
      });
    });
    const mine=fresh.filter(x=>x.burden!=="share").length;
    document.getElementById("cv-prev").innerHTML = list.length
      ? `<div class="card" style="margin-top:14px">${fresh.slice(0,5).map(rowHTML).join("")||emptyHTML("新しいものは無し","")}</div>
         <div class="note num">読めたもの ${list.length} 件のうち、新しいものは <b>${fresh.length} 件・${yen(sum)}</b>。
         ${list.length-fresh.length?`残り ${list.length-fresh.length} 件はすでに入っており申す。`:""}
         ${mine?`<br>うち <b>${mine}件</b>は「個人の負担に倒す店」に当たったゆえ、自動で個人の負担にいたす。`:""}</div>
         ${clash.length?`<div class="warnbox">取り込む行と<b>同じ額の固定費</b>がござる ――
           ${clash.slice(0,4).map(v=>esc(v.f)+"（明細では「"+esc(v.s)+"」）").join("、")}。
           <b>二重に数えて精算が狂い申す。</b>設定 → 固定費 から、その固定費を外してくだされ。</div>`:""}`
      : `<div class="note">その組み合わせでは1件も読めており申さぬ。列か、飛ばす行を変えてくだされ。</div>`;
    document.getElementById("cv-go").disabled = !fresh.length;
  };
  ["m-date","m-shop","m-amt","m-skip","m-pay"].forEach(id=>document.getElementById(id).onchange=refresh);

  if(!S.cfg.csvMap) autoGuess();
  refresh();

  document.getElementById("cv-go").onclick=async ()=>{
    const map=readMap();
    // ⚠ 引落月は覚えない。覚えると次の取り込みに古い月が紛れ込む。列と飛ばす行だけ。
    S.cfg.csvMap={date:map.date, shop:map.shop, amt:map.amt, skip:map.skip}; save("cfg",S.cfg);
    const fresh=csvToItems(rows,map).filter(x=>!findDup(x,S.items));
    closeSheet();
    await pushMany("add", fresh);          // ⚠ 1件ずつ送ると40件で40往復して待たされる
    toast(fresh.length+"件を取り込み申した");
  };

  function autoGuess(){
    const sample=rows.slice(0,12);
    let best={date:0, amt:width>1?width-1:0, shop:1}, dS=-1,aS=-1,sS=-1;
    for(let i=0;i<width;i++){
      let d=0,a=0,s=0;
      sample.forEach(r=>{
        const v=String(r[i]||"").trim(); if(!v) return;
        if(/^\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}/.test(v)) d++;
        if(/^[\-\d,]+$/.test(v) && v.replace(/[^0-9]/g,"").length>=2) a++;
        if(v.length>=3 && !/^[\d,\/\-]+$/.test(v)) s++;
      });
      if(d>dS){dS=d;best.date=i;} if(a>aS){aS=a;best.amt=i;} if(s>sS){sS=s;best.shop=i;}
    }
    document.getElementById("m-date").value=best.date;
    document.getElementById("m-amt").value=best.amt;
    document.getElementById("m-shop").value=best.shop;
    document.getElementById("m-skip").value = /^\d{4}/.test(String(rows[0][best.date]||""))?0:1;
  }
}


/* 明細のいちばん新しい利用日から、引き落とし月を当てる。
   月末締め・翌月26日払いゆえ「いちばん新しい利用日の翌月」。上様が画面で直せる。 */
function guessPay(rows){
  let mx="";
  rows.forEach(r=>r.forEach(v=>{
    const g=String(v||"").match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(g){ const s=g[1]+"-"+String(g[2]).padStart(2,"0")+"-"+String(g[3]).padStart(2,"0"); if(s>mx) mx=s; }
  }));
  return mx ? shiftMonth(mx.slice(0,7),1) : ym(new Date());
}
function csvToItems(rows,map){
  const out=[];
  rows.slice(map.skip).forEach(r=>{
    const m=String(r[map.date]||"").trim().match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(!m) return;
    const amt=Number(String(r[map.amt]||"").replace(/[^0-9\-]/g,""));
    if(!amt) return;
    const shop=String(r[map.shop]||"").trim();
    /* ⚠ マイナス行は**返品・返金**（2026-08-21 より取り込む）。
       金額は正のまま持ち、種別を `入金` にして符号を種別へ預ける。
       捨てていた頃は、取り込んだ合計が明細の合計と合わなかった。 */
    out.push({ id:uid(),
      date:m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0"),
      cat:guessCat(shop)||"その他", amount:Math.abs(amt),
      payer:"c", burden:guessMine(shop)||"share", shop, memo:"", src:"CSV",
      kind: amt<0 ? "入金" : "",
      pay: map.pay || undefined });
  });
  return out;
}

/* ---------- 繋ぎこみ ---------- */

function bindAll(){
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    S.month=shiftMonth(S.month,Number(b.dataset.mv)); render();
  });
  document.querySelectorAll("[data-edit]").forEach(r=>r.onclick=()=>{
    const it=S.items.find(x=>x.id===r.dataset.edit); if(it) openEditor(it);
  });
  document.querySelectorAll(".more[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.open;
    if(k==="csv") openCsv(); else if(k==="receipt") openReceipt(); else openConfig(k);
  });
  document.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>pullAll());
}

document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById("fab").onclick=()=>openEditor(null);
document.getElementById("sheetbg").onclick=closeSheet;

S.items=cached();
render();
pullAll();
window.addEventListener("online",()=>pullAll());

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
