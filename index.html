<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EAF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B211D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月の出費">
<title>月の出費</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ============================================================
   Material Design 3 ―― 種色は深緑（hue ≒ 155）。2026-08-30 に総取り替え。
   守る決まりは三つ。崩すと元の「AIっぽい画面」に戻り申す。
     1. 面は surface-container の階調で高さを出す。**影はFABとsnackbarだけ。**
     2. 角丸は Shape scale の 4 / 8 / 12 / 16 / 28 のみ。他の値を書かない。
     3. 色は「意味」にだけ差す ―― 共有=primary / 諒=secondary / 万貴=tertiary / 促し=error。
        費目に色は割り当てない（濃淡で額の大小を表す。--ramp-1〜6 を見よ）。
   ============================================================ */
:root{
  --m-primary:#1F6C46;             --m-on-primary:#FFFFFF;
  --m-primary-container:#A6F2C4;   --m-on-primary-container:#00522E;
  --m-secondary:#4C6357;           --m-on-secondary:#FFFFFF;
  --m-secondary-container:#CFE9D9; --m-on-secondary-container:#0A1F16;
  --m-tertiary:#3B6472;            --m-on-tertiary:#FFFFFF;
  --m-tertiary-container:#BFE9F8;  --m-on-tertiary-container:#001F28;
  --m-error:#BA1A1A;               --m-on-error:#FFFFFF;
  --m-error-container:#FFDAD6;     --m-on-error-container:#410002;

  --m-surface:#F6FBF6;
  --m-surface-container-lowest:#FFFFFF;
  --m-surface-container-low:#F0F6F0;
  --m-surface-container:#EAF0EA;
  --m-surface-container-high:#E5EBE5;
  --m-surface-container-highest:#DFE4DF;
  --m-on-surface:#171D19;
  --m-on-surface-variant:#3F4943;
  --m-outline:#6F7973;
  --m-outline-variant:#BFC9C1;
  --m-inverse-surface:#2C322E;
  --m-inverse-on-surface:#EDF2EB;
  --m-scrim:rgba(0,0,0,.32);

  /* 費目バーの濃淡。額の多い順に 1→6 を当てる（toneOf）。7位以降は 6 で頭打ち。 */
  --ramp-1:#1F6C46; --ramp-2:#3B8161; --ramp-3:#5C9C7D;
  --ramp-4:#82B79B; --ramp-5:#AAD2BA; --ramp-6:#CFE4D7;

  /* Shape scale。**ここに無い角丸を書かないこと。** */
  --sh-xs:4px; --sh-s:8px; --sh-m:12px; --sh-l:16px; --sh-xl:28px; --sh-full:999px;
}
@media (prefers-color-scheme: dark){
  :root{
    --m-primary:#8BD8AB;             --m-on-primary:#00391F;
    --m-primary-container:#00522E;   --m-on-primary-container:#A6F2C4;
    --m-secondary:#B4CCBC;           --m-on-secondary:#20352A;
    --m-secondary-container:#364B3F; --m-on-secondary-container:#CFE9D9;
    --m-tertiary:#A3CDDC;            --m-on-tertiary:#033541;
    --m-tertiary-container:#214C58;  --m-on-tertiary-container:#BFE9F8;
    --m-error:#FFB4AB;               --m-on-error:#690005;
    --m-error-container:#93000A;     --m-on-error-container:#FFDAD6;

    --m-surface:#0F1511;
    --m-surface-container-lowest:#0A0F0C;
    --m-surface-container-low:#171D19;
    --m-surface-container:#1B211D;
    --m-surface-container-high:#262B27;
    --m-surface-container-highest:#313631;
    --m-on-surface:#DFE4DF;
    --m-on-surface-variant:#BFC9C1;
    --m-outline:#89938C;
    --m-outline-variant:#3F4943;
    --m-inverse-surface:#DFE4DF;
    --m-inverse-on-surface:#2C322E;
    --m-scrim:rgba(0,0,0,.5);

    --ramp-1:#8BD8AB; --ramp-2:#77C298; --ramp-3:#63AC85;
    --ramp-4:#4F9672; --ramp-5:#3C7F5F; --ramp-6:#2A694D;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--m-surface); color:var(--m-on-surface);
  /* Roboto と Noto Sans JP は Android 端末に載っておる。**外部から読み込まぬこと** ――
     sw.js が外部通信を横取りせぬ造りゆえ、CDNから引くと圏外で字が崩れる。 */
  font-family:Roboto,"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--m-on-surface)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
/* Material Symbols（Apache 2.0）の線画。使う分だけ ICON_D に path を埋めてある。 */
svg.i{width:24px;height:24px;fill:currentColor;display:block;flex:0 0 auto}
svg.i.s20{width:20px;height:20px}
svg.i.s18{width:18px;height:18px}

header{padding:calc(8px + env(safe-area-inset-top)) 0 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.hrow>div:last-child{display:flex;align-items:center;flex:0 0 auto;white-space:nowrap}
.month-pick{display:flex;align-items:center;gap:2px;min-width:0}
.month-pick b{font-size:22px;line-height:28px;font-weight:400;padding:0 6px;white-space:nowrap}
.arrowbtn{width:40px;height:40px;border-radius:var(--sh-full);display:flex;align-items:center;justify-content:center;color:var(--m-on-surface-variant);flex:0 0 40px}
.arrowbtn:active{background:var(--m-surface-container-high)}
.arrowbtn:disabled{opacity:.38}
.pill{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.5px;padding:4px 10px;border-radius:var(--sh-s);background:var(--m-surface-container-high);color:var(--m-on-surface-variant);margin-left:6px}
.pill.warn{background:var(--m-error-container);color:var(--m-on-error-container)}

.card{background:var(--m-surface-container-low);border-radius:var(--sh-m);padding:12px 16px;margin-bottom:8px}

/* 唯一、色を大きく敷く場所。ここ以外の面は無彩に近い階調で通す。 */
.hero{background:var(--m-primary);color:var(--m-on-primary);border-radius:var(--sh-l);padding:20px;margin-bottom:8px}
@media (prefers-color-scheme: dark){
  .hero{background:var(--m-primary-container);color:var(--m-on-primary-container)}
}
.hero .lbl{font-size:11px;font-weight:500;letter-spacing:.5px;opacity:.9}
.hero .big{font-size:36px;line-height:44px;font-weight:400;margin:4px 0 0}
.hero .sub{font-size:12px;line-height:16px;opacity:.85;margin-top:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{border-radius:var(--sh-m);padding:14px 16px}
.tile .lbl{font-size:11px;font-weight:500;letter-spacing:.5px;opacity:.9}
.tile .val{font-size:22px;line-height:28px;font-weight:400;margin-top:2px}
.tile .sub2{font-size:11px;line-height:16px;opacity:.8;margin-top:4px}
/* クラス名は据え置き（JSが吐いておる）。中身は 諒=secondary / 万貴=tertiary。 */
.t-teal{background:var(--m-secondary-container);color:var(--m-on-secondary-container)}
.t-pink{background:var(--m-tertiary-container);color:var(--m-on-tertiary-container)}

.bill,.send,.loan,.settle{background:var(--m-surface-container-high);color:var(--m-on-surface);border-radius:var(--sh-m);padding:16px;margin-bottom:8px}
.bill .hd,.send .hd,.loan .hd,.settle .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bill .hd .ic,.send .hd .ic,.loan .hd .ic,.settle .ic{display:flex;color:var(--m-primary)}
.bill .hd .lbl,.send .hd .lbl,.loan .hd .lbl,.settle .lbl{font-size:11px;font-weight:500;letter-spacing:.5px;line-height:16px;color:var(--m-on-surface-variant)}
.bill .big{font-size:28px;line-height:36px;font-weight:400}
.loan .big{font-size:22px;line-height:28px;font-weight:400}
.settle .val{font-size:16px;line-height:24px;font-weight:500}
.bill .brk{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bill .chip{font-size:11px;font-weight:500;min-height:0;padding:4px 10px;border-radius:var(--sh-s);background:var(--m-surface-container-lowest);color:var(--m-on-surface-variant);box-shadow:none}
.bill .memo,.send .memo,.loan .memo{font-size:12px;line-height:18px;margin-top:10px;color:var(--m-on-surface-variant)}
.send .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.send .who{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--m-on-surface-variant);margin-bottom:2px}
.send .amt{font-size:24px;line-height:32px;font-weight:400}
/* 済んだ月・渡し終えた貸借は secondary へ沈める。 */
.send.done,.loan.done,.settle.even{background:var(--m-secondary-container);color:var(--m-on-secondary-container)}
.send.done .hd .ic,.loan.done .hd .ic,.send.done .lbl,.loan.done .lbl,
.send.done .who,.send.done .memo,.loan.done .memo{color:inherit;opacity:.9}
/* 精算を締める釦（M3 の filled button）。上の .settle 札より詳しいゆえ勝つ。 */
.send .settle{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;background:var(--m-primary);color:var(--m-on-primary);font-size:14px;font-weight:500;letter-spacing:.1px;padding:12px 24px;border-radius:var(--sh-full);margin:16px 0 0}
.send .settle.ghost{background:transparent;color:var(--m-primary);box-shadow:inset 0 0 0 1px var(--m-outline)}
.send .memo .mini,.loan .memo .mini{margin-left:6px;vertical-align:middle}

.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;padding:10px 0;color:var(--m-on-surface-variant)}
.sumrow+.sumrow{border-top:1px solid var(--m-outline-variant)}
.sumrow b{font-weight:500;color:var(--m-on-surface)}
.sumrow.big{font-size:16px;padding-top:14px;color:var(--m-on-surface)}

.sechead{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 8px}
.sechead h2{font-size:11px;font-weight:500;color:var(--m-on-surface-variant);margin:0;letter-spacing:.5px}
.sechead .more{font-size:14px;font-weight:500;color:var(--m-primary);letter-spacing:.1px}
.sechead .more.num{color:var(--m-on-surface-variant);font-weight:400}

.row{display:flex;align-items:center;gap:16px;padding:8px 0;min-height:56px}
.row+.row{border-top:1px solid var(--m-outline-variant)}
/* 費目で色を変えない。額は右の数字で読み、種類は絵で読む。 */
.ic-circle{width:40px;height:40px;border-radius:var(--sh-full);display:flex;align-items:center;justify-content:center;flex:0 0 40px;background:var(--m-surface-container-highest);color:var(--m-on-surface-variant)}
.ic-circle.accent{background:var(--m-primary-container);color:var(--m-on-primary-container)}
.row .body{flex:1;min-width:0}
.row .t1{font-size:16px;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;line-height:18px;color:var(--m-on-surface-variant);margin-top:1px}
.row .amt{font-size:16px;line-height:22px;font-weight:500;white-space:nowrap}

.tag{display:inline-block;font-size:11px;font-weight:500;line-height:16px;padding:0 8px;border-radius:var(--sh-xs);margin-left:6px;vertical-align:1px}
.tag.c{background:var(--m-primary-container);color:var(--m-on-primary-container)}
.tag.r{background:var(--m-secondary-container);color:var(--m-on-secondary-container)}
.tag.m{background:var(--m-tertiary-container);color:var(--m-on-tertiary-container)}
.tag.gray{background:var(--m-surface-container-highest);color:var(--m-on-surface-variant)}
.tag.in{background:transparent;color:var(--m-primary);box-shadow:inset 0 0 0 1px var(--m-outline)}
.amt.plus{color:var(--m-primary)}

.empty{text-align:center;padding:32px 12px;color:var(--m-on-surface-variant);font-size:14px;line-height:20px}
.empty .e-ic{display:flex;justify-content:center;margin-bottom:10px;color:var(--m-outline)}
.empty .e-ic svg{width:32px;height:32px}

.barrow{margin-bottom:16px}
.barrow:last-child{margin-bottom:4px}
.barrow .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;line-height:20px;margin-bottom:6px}
.barrow .bh .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:400}
.barrow .bh .nm svg{color:var(--m-on-surface-variant)}
.barrow .bh .vl{font-weight:500}
.barrow .bh .pc{font-size:12px;color:var(--m-on-surface-variant);margin-left:8px;font-weight:400}
.track{height:8px;border-radius:var(--sh-full);background:var(--m-surface-container-highest);overflow:hidden}
.fill{height:100%;border-radius:var(--sh-full);transition:width .4s cubic-bezier(.2,0,0,1)}

.mbars{display:flex;align-items:flex-end;gap:8px;padding-top:8px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.mbar .bb{width:100%;background:var(--m-primary);border-radius:var(--sh-xs);min-height:4px;transition:height .4s cubic-bezier(.2,0,0,1)}
.mbar .bb.dim{background:var(--m-secondary-container)}
.mbar .ml{font-size:11px;color:var(--m-on-surface-variant);white-space:nowrap}

/* M3 の Navigation bar。選んだ札は丸薬型の下敷きで示す ―― 色を塗り分けない。 */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--m-surface-container);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:80px}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--m-on-surface-variant);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.nb .ni{width:64px;height:32px;border-radius:var(--sh-full);display:flex;align-items:center;justify-content:center;transition:background .2s}
.nb.on{color:var(--m-on-surface)}
.nb.on .ni{background:var(--m-secondary-container);color:var(--m-on-secondary-container)}
/* M3 の FAB は真円でなく角丸16px。影を許すのはここと snackbar だけ。 */
.fab{width:56px;height:56px;border-radius:var(--sh-l);background:var(--m-primary-container);color:var(--m-on-primary-container);display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 3px 6px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.24)}
.fab:active{background:var(--m-primary);color:var(--m-on-primary)}

.sheet-bg{position:fixed;inset:0;background:var(--m-scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--m-surface-container-low);border-radius:var(--sh-xl) var(--sh-xl) 0 0;z-index:51;transform:translateY(100%);transition:transform .3s cubic-bezier(.05,.7,.1,1);max-height:94vh;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet-in{max-width:520px;margin:0 auto;padding:0 16px}
.grab{width:32px;height:4px;border-radius:var(--sh-full);background:var(--m-outline-variant);margin:16px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;margin-bottom:8px}
.sheet-head h3{font-size:22px;line-height:28px;font-weight:400;margin:0}
.xbtn{width:40px;height:40px;border-radius:var(--sh-full);display:flex;align-items:center;justify-content:center;color:var(--m-on-surface-variant);flex:0 0 40px}
.xbtn:active{background:var(--m-surface-container-high)}

.amtbox{background:var(--m-surface-container-high);border-radius:var(--sh-l);padding:20px 16px;text-align:center;margin-bottom:20px}
.amtbox input{width:100%;border:none;background:none;text-align:center;font-size:40px;line-height:48px;font-weight:400;color:var(--m-on-surface);outline:none;padding:0}
.amtbox input::placeholder{color:var(--m-outline)}
.flabel{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--m-on-surface-variant);margin:0 4px 8px}
.flabel .hint{font-weight:400;letter-spacing:0;color:var(--m-outline);margin-left:6px}

/* M3 の filter chip。**角丸8px、選ばぬうちは輪郭線だけ。**丸薬型に戻さぬこと。 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;letter-spacing:.1px;min-height:32px;padding:6px 14px;border-radius:var(--sh-s);background:transparent;color:var(--m-on-surface-variant);box-shadow:inset 0 0 0 1px var(--m-outline)}
.chip svg{width:18px;height:18px}
.chip.on{box-shadow:none;background:var(--m-secondary-container);color:var(--m-on-secondary-container)}
.chip:active{opacity:.85}
.trio{display:flex;gap:8px;margin-bottom:20px}
.trio .chip{flex:1;justify-content:center;padding:10px 8px;font-size:13px;line-height:1.35;text-align:center}
.trio.kinds{margin-bottom:16px}

/* M3 の filled text field。上だけ角を丸め、下に一本線を敷く。 */
.field{background:var(--m-surface-container-high);border-radius:var(--sh-xs) var(--sh-xs) 0 0;padding:8px 16px 6px;margin-bottom:12px;border-bottom:1px solid var(--m-on-surface-variant)}
.field:focus-within{border-bottom:2px solid var(--m-primary);padding-bottom:5px}
.field label{display:block;font-size:12px;line-height:16px;color:var(--m-on-surface-variant)}
.field:focus-within label{color:var(--m-primary)}
.field input,.field select,.field textarea{width:100%;border:none;background:none;outline:none;padding:2px 0;font-size:16px;line-height:24px}
.field textarea{resize:none;min-height:24px}

.save{width:100%;background:var(--m-primary);color:var(--m-on-primary);font-size:14px;font-weight:500;letter-spacing:.1px;min-height:48px;padding:12px 24px;border-radius:var(--sh-full);margin-top:12px}
.save:active{opacity:.9}
.save.del{background:var(--m-error-container);color:var(--m-on-error-container);margin-top:8px;min-height:40px}
.save.ghost{background:transparent;color:var(--m-primary);box-shadow:inset 0 0 0 1px var(--m-outline);margin-top:8px;min-height:40px}
.save:disabled{opacity:.38}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;min-height:56px}
.setrow+.setrow{border-top:1px solid var(--m-outline-variant)}
.setrow .sl{font-size:16px;line-height:22px}
.setrow .sd{font-size:12px;line-height:18px;color:var(--m-on-surface-variant);margin-top:2px}
.mini{font-size:14px;font-weight:500;letter-spacing:.1px;min-height:32px;padding:6px 16px;border-radius:var(--sh-full);background:var(--m-primary);color:var(--m-on-primary);white-space:nowrap}
.mini.ghost{background:transparent;color:var(--m-primary);box-shadow:inset 0 0 0 1px var(--m-outline)}
/* 個人帳面（資産タブ）。色は既存の役割色・濃淡だけを使う。 */
.setrow .amt-nw{white-space:nowrap;flex:0 0 auto;font-weight:500}
.mbar .ml .rt{display:block;font-size:10px;line-height:14px;margin-top:2px;text-align:center}
.acct-row{background:var(--m-surface-container-low);border-radius:var(--sh-m);padding:12px 16px;margin-bottom:8px}
.acct-row .field{margin-bottom:8px}
.acct-row .flags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acct-row .chip{min-height:28px;padding:4px 12px;font-size:12px}
.hero .sub b{font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:var(--sh-full);margin-right:6px}
.dot.ok{background:var(--m-primary)} .dot.ng{background:var(--m-outline)} .dot.er{background:var(--m-error)}

/* M3 の snackbar。角丸は 4px。 */

.maprow .mk{font-size:14px;width:86px;flex:0 0 86px}

.note{font-size:12px;color:var(--m-on-surface-variant);line-height:18px;margin:12px 4px}
/* M3 に「警告」の役は無い。促しは error-container で受ける。 */
.warnbox{background:var(--m-error-container);color:var(--m-on-error-container);border-radius:var(--sh-m);padding:14px 16px;font-size:12px;line-height:18px;margin-bottom:12px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:var(--sh-full);animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb{width:100%;border-radius:var(--sh-m);margin-bottom:12px;display:block}
</style>

   extra  … 按分の外で上乗せしている額(共有カード払いの個人保険など)

async function api(action, payload){ return callApi(S.cfg.api, S.cfg.token, action, payload); }
/* ⚠ 個人帳面の接続先が共有の家計簿と同じなら、通信しない。個人の取引が共有の明細へ書かれてしまう。
   保存時にも断っているが、共有側の接続先をあとで同じに変えた場合に備えて、通信のたびに見る。 */
const normApi = u => String(u||"").trim().replace(/\/exec.*$/,"/exec");
async function apiMine(action, payload){
  if(S.cfg.mineApi && S.cfg.api && normApi(S.cfg.mineApi)===normApi(S.cfg.api))
    throw new Error("個人帳面の接続先が、共有の家計簿と同じになっています");
  return callApi(S.cfg.mineApi, S.cfg.mineToken, action, payload, true);
}

/* 合言葉なしで叩ける問い合わせ（ping）などを、JSONで返す。接続先の確認に使う。
   HTMLが返ったときは "HTML"、JSONでないときは "読めません" の Error を投げる。 */
async function mineHit(base, action, tok){
  const url = base + (base.includes("?")?"&":"?") + "action="+encodeURIComponent(action) + "&token="+encodeURIComponent(tok||"");
  const res = await fetch(url, {redirect:"follow"});
  const txt = await res.text();
  if(!res.ok) throw new Error("HTTP "+res.status);
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error(/<html|<!DOCTYPE/i.test(txt) ? "HTML" : "読めません"); }
}

async function callApi(base, tok, action, payload, plain){
  if(!base) throw new Error("未接続");
  const url = base + (base.includes("?")?"&":"?") + "action="+encodeURIComponent(action) + "&token="+encodeURIComponent(tok||"");
  const opt = payload
    ? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow"}
    : {method:"GET", redirect:"follow"};
  const res = await fetch(url, opt);
  if(!res.ok) throw new Error("HTTP "+res.status);
  /* ⚠ そのまま res.json() を呼ばぬこと。
     デプロイの「アクセスできるユーザー」が『全員』でないと、Googleは**ログイン画面のHTML**を返す。
     JSONとして読もうとして「Unexpected token '<'」と出るだけでは、何が悪いのか分からぬ。 */
  const txt = await res.text();
  let j;
  try{ j = JSON.parse(txt); }
  catch(e){
    if(/<html|<!DOCTYPE/i.test(txt))
      throw new Error(plain ? "個人帳面がJSONを返しません。デプロイの「アクセスできるユーザー」が『全員』になっていない見込みです"
                            : "帳面がJSONを返し申さぬ。デプロイの「アクセスできるユーザー」が『全員』になっておらぬ見込み");
    throw new Error(plain ? "返りが読めません ―― "+txt.slice(0,60) : "返りが読めず申さぬ ―― "+txt.slice(0,60));
  }
  if(j.ok===false) throw new Error(j.error||"エラー");
  return j;
}

/* ---------- 二人で揃える決め事（2026-08-21 追加） ----------
 *
 * 呼び名・按分・固定費・店名辞書・精算日・締めた月は**スプレッドシートに置く。**
 * これらは金の額に効くゆえ、端末ごとに散らばっていると
 * **同じ月を開いた二人に違う振込額が出る。** それを避けるためである。
 *
 * ⚠ 接続先URLと合言葉は端末ごと。決してシートへ送らない（`SHARED_KEYS` に入れない）。
 * ⚠ 後勝ちである。二人が同時に設定を触れば、あとに保存したほうが残る。
 */
async function pullConfig(){
  /* ⚠ 古い `Code.gs` のままだと「知らぬ用向き: config」で断られる。
     ここで throw させると pullAll ごと落ちて、**明細まで圏外扱いになる。**
     決め事が取れずとも明細は取れるゆえ、黙って見送り、控えを正とする。 */
  let j;
  try{ j = await api("config"); }catch(e){ S.cfgStale=true; return; }
  S.cfgStale=false;
  if(!j.config) return;                       // シートがまだ空。こちらの控えを正とする
  SHARED_KEYS.forEach(k=>{ if(j.config[k]!=null) S.cfg[k]=j.config[k]; });
  save("cfg", S.cfg);
}

/* 決め事を控えて、シートへも送る。**共有の決め事を変えたら必ずこれを通すこと。**
   `save("cfg",…)` だけで済ますと、その端末にしか残らず相手と食い違う。 */
function saveCfg(){
  save("cfg", S.cfg);
  if(!S.cfg.api) return;
  api("saveConfig", sharedCfg())
    .then(()=>{ S.online=true; })
    .catch(()=>{
      /* ⚠ 決め事の送りは**溜めない。最後の一つだけ持つ。**
         古い帳面へ送り続けると失敗するたびに積み上がり、繋がった折に古い決め事まで送り直してしまう。 */
      S.queue = S.queue.filter(q=>q.action!=="saveConfig");
      S.queue.push({action:"saveConfig", payload:sharedCfg()});
      save("queue",S.queue); S.online=false;
    });
}

/* まとめて送る。1件ずつだと40件で40往復して待たされるゆえ。 */
async function pushMany(action, list){
  if(!list.length) return;
  if(action==="add") S.items=list.concat(S.items);
  else S.items=S.items.map(x=>{ const n=list.find(v=>v.id===x.id); return n||x; });

  if(!S.cfg.api) return;
  try{ await api("bulk",{items:list}); S.online=true; }
  catch(e){ S.queue.push({action:"bulk", payload:{items:list}}); save("queue",S.queue); S.online=false; toast("圏外のため後で送り申す"); }
}

async function pushItem(action, item){
  if(action==="add") S.items.unshift(item);
  else if(action==="update") S.items=S.items.map(x=>x.id===item.id?item:x);
  else if(action==="delete") S.items=S.items.filter(x=>x.id!==item.id);
  setCached(S.items); render();
  if(!S.cfg.api) return;
  try{ await api(action,item); S.online=true; }
  catch(e){ S.queue.push({action,payload:item}); save("queue",S.queue); S.online=false; toast("圏外のため後で送り申す"); }
}

/* ---------- 個人帳面のデータ層 ----------
 *
 * 共有の家計簿（items）とは混ぜない。理由は二つ。
 *   1. 家の「今月の出費」は支払元・負担を問わず全部足す。個人の支出を明細に混ぜると膨らむ。
 *   2. 給与など本人だけの数字を、共有の合言葉を持つ人から読める場所に置かない。

 */
/* 同時に二本走らせない。起動・復帰・接続の保存が重なると、溜めた分を二重に送って同じ記録が2行になる。 */
let mineInflight=null;
function pullMine(){
  if(mineInflight) return mineInflight;
  mineInflight = pullMineRun().finally(()=>{ mineInflight=null; });
  return mineInflight;
}

async function pullMineRun(){
  if(!S.cfg.mineApi){ S.my.online=false; S.my.err=""; S.my.syncing=false; return; }
  S.my.syncing=true; if(S.tab==="mine") render();
  try{
    /* ⚠ 溜めた分を送る前に、相手が個人帳面かを確かめる（共有の Code.gs だと、取引が共有の明細へ入ってしまう）。 */
    const p = await apiMine("ping");
    if(!p || p.kind!=="mine") throw new Error("接続先が個人帳面ではありません");
    await flushMyQueue();
    const a = await apiMine("accounts");
    if(a.accounts && a.accounts.length){ S.my.accts=a.accounts; save("myaccts", S.my.accts); }
    else{
      /* 帳面の口座が空 ＝ 初回。この端末の初期の口座を送って揃える。 */
      try{ await apiMine("saveAccounts", {accounts:S.my.accts}); }catch(e){}
    }
    const j = await apiMine("list");
    /* 帳面に同じ id が2行あっても、画面では1件にする（収入の二重計上を避ける）。 */
    const seen={};
    S.my.tx = (j.items||[]).filter(x=>!seen[x.id] && (seen[x.id]=true));
    save("mytx", S.my.tx);
    S.my.online=true; S.my.err="";
  }catch(e){
    S.my.online=false; S.my.err=e.message;
  }finally{ S.my.syncing=false; render(); }
}

async function pushMy(action, item){

/* まとめて送る。同じ id は上書きになるので、同じ内容を何度取り込んでも二重にならない。 */
async function pushMyMany(list){
  if(!list.length) return;
  const ids={}; list.forEach(x=>ids[x.id]=x);
  S.my.tx = list.concat(S.my.tx.filter(x=>!ids[x.id]));

/* 外から来た取引（給与JSONなど）を検査して整える。形が合わないものは null。 */
function normMyTx(x){
  if(!x || !x.id) return null;
  const type=String(x.type||""); if(!MY_TYPES.includes(type)) return null;
  const amount=Number(x.amount); if(!(amount>0) || Math.round(amount)!==amount) return null;
  const date=String(x.date||"").slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
  const acct=String(x.acct||""), to=String(x.to||"");
  if(type==="移動" && (!to || to===acct)) return null;
  return {id:String(x.id).slice(0,80), date, type, amount, acct, to,
          cat:String(x.cat||""), shop:String(x.shop||""), memo:String(x.memo||""), src:String(x.src||"取込")};
}

/* ---------- 期(いつからの決め事か) ---------- */

// 古い形（contrib を直に持っていた頃）で保存されていたら、base/ratio/extra に均す。
function normPlan(p){
  if(!p) return {from:"2000-01",base:0,ratio:0.5,extra:{r:0,m:0},fixed:[]};
  if(p.base==null){
    const c=p.contrib||{r:0,m:0}, base=250000, ratio=Number(p.ratio)||0.5;
    p.base=base;
    p.extra={ r:Math.max(0,(Number(c.r)||0)-base*ratio), m:Math.max(0,(Number(c.m)||0)-base*(1-ratio)) };
  }
  p.extra=p.extra||{r:0,m:0};
  p.base=Number(p.base)||0; p.ratio=Number(p.ratio)||0;
  p.savings=Math.max(0, Number(p.savings)||0);   // 古い期には無いので0に均す
  return p;
}
function contribOf(p){
  return { r: Math.round(p.base*p.ratio)+(Number(p.extra.r)||0),
           m: Math.round(p.base*(1-p.ratio))+(Number(p.extra.m)||0) };
}
function planFor(m){
  const ps=(S.cfg.plans||[]).map(normPlan).sort((a,b)=>a.from.localeCompare(b.from));
  let cur=ps[0]||normPlan(null);
  for(const p of ps) if(p.from<=m) cur=p;
  return cur;
}

function fixedFor(m){
  return (planFor(m).fixed||[]).filter(f=>f.on!==false).map(f=>({
    id:"fixed:"+m+":"+f.name, date:m+"-01", cat:f.cat||"住居",
    amount:Number(f.amount)||0, payer:f.payer||"c", burden:f.burden||"share",
    shop:f.name, memo:"固定費", fixed:true
  }));
}

/* ---------- 集計と精算 ---------- */

/**
 * 二つの時計（2026-08-19 上様の指図により追加）
 *
 * この帳面は月を二通りに数える。**混ぜてはならぬ。**
 *
 *   利用月 (`date` の月)  … 「その月にいくら使ったか」を見るための月
 *   引落月 (`pay`)        … 「共有口座からいつ出ていくか」＝振り込むべき月
 *
 * 共有カードは使った日と引き落とされる日がひと月ずれる（7月利用 → 8月26日引落）。
 * ゆえに取り込んだ明細には、明細ごとの引落月を `pay` として持たせる。
 * 現金や各自のキャッシュレスの立替は、その月のうちに精算するので `pay` は使った月と同じ。
 */
/* ⚠ 引落月は「2026-08」の文字列のはずだが、**スプレッドシートを一度往復すると化ける。**
   Googleスプレッドシートは "2026-08" を日付と解して勝手に Date に直してしまうため、
   GASから返ってくるときには "Sat Aug 01 2026 00:00:00 GMT+0900 (JST)" になっている。
   （2026-08-20 に踏んだ ―― 明細を取り込んだのに「1件もござらぬ」と警告が出続けた正体がこれ）
   GAS側でも直したが、**すでにシートへ日付として書かれてしまった行**があるので、
   受け取る側でも必ず yyyy-MM へ均す。時差でひと月ずれぬよう、文字列のまま読むこと。 */
const MONNM = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function normYM(v){
  if(!v) return "";
  const s=String(v).trim();
  let g=s.match(/^(\d{4})[-\/.年](\d{1,2})/);                       // 2026-08 / 2026/08/01 / 2026年8月
  if(g) return g[1]+"-"+String(Number(g[2])).padStart(2,"0");
  g=s.match(/\b([A-Za-z]{3})[a-z]*\s+\d{1,2}\s+(\d{4})\b/);       // Sat Aug 01 2026 …（Dateの文字列）
  if(g && MONNM[g[1].toLowerCase()]) return g[2]+"-"+String(MONNM[g[1].toLowerCase()]).padStart(2,"0");
  return "";
}
/* 精算日（既定20日）。二人が共有口座へ振り込む日。カードの引き落としは26日ゆえ、その前に入れておく。 */
function settleDay(){ return Number(S.cfg.settleDay)||20; }
function closedCount(){ return Object.keys(S.cfg.closed||{}).length; }
function closedOf(m){ return (S.cfg.closed||{})[m]||null; }
function isClosed(m){ return !!closedOf(m); }

/* 引落月を持たぬものの既定 ―― どの精算に乗るか。
   1. **共有カード以外**は、精算日を過ぎて使ったぶんはその月の振り込みに間に合わぬゆえ翌月へ回す。
      （共有カードはこの締めと関わりない。月末締め・翌26日払いで、取り込みが `pay` を刻む）
   2. そのうえで、**既に締めた月は飛び越える。** 金はもう動いたのだから、後から差し込めぬ。
   ⚠ 締めるときに、その月に乗っていたものへは `pay` を刻んで凍らせる。
     ゆえにこの既定が効くのは「まだ締めておらぬ月ぶん」だけである。 */
function defaultPay(x){
  const d = String(x.date||"");
  let m = d.slice(0,7);
  if(!m) return "";
  if(x.payer !== "c" && Number(d.slice(8,10)) >= settleDay()) m = shiftMonth(m,1);
  for(let i=0; i<60 && isClosed(m); i++) m = shiftMonth(m,1);   // 締めた月は飛ばす
  return m;
}
function payOf(x){ return normYM(x.pay) || defaultPay(x); }

/* ---------- 種別 ―― 出費 / 入金 / 貸借（2026-08-21 上様の指図により追加） ----------
 *
 * この帳面が扱う金の動きは三通りある。**混ぜると出費の額が嘘になる。**
 *
 *   出費（既定・空欄）… 家から金が出る。今月の出費に数える
 *   入金             … 家に金が入る（保険金・助成金・還付・カードの返金）。
 *                      **出費には数えぬが、精算には効く** ―― 出費の逆向きとして
 *   貸借             … 二人のあいだで金が移っただけ。家の金は動いておらぬ。
 *                      **出費にも精算にも一切効かぬ。**効くのは 🤝 の残高だけ
 *
 * ⚠ **金額は種別によらず常に正の整数で持つ。** 入金を負の数で保存しない。
 *   符号は `signed()` が種別から決める ―― 数の符号に意味を持たせると、
 *   旧Excelの「負の数で個人の支出を表す」と同じ混乱に戻る。
 */
function kindOf(x){ const k=String((x&&x.kind)||""); return (k==="入金"||k==="貸借") ? k : ""; }
function isIn(x){ return kindOf(x)==="入金"; }
function isLoan(x){ return kindOf(x)==="貸借"; }
function signed(x){ return (Number(x.amount)||0) * (isIn(x) ? -1 : 1); }

/* 二人のあいだで動かす金の正味。
 *
 * ⚠⚠ **向きは「この精算で誰から誰へ渡すか」である。**（2026-08-21 上様のご指摘により改めた）
 *   支払元＝**渡す人**、負担＝**受け取る人**。正なら「諒 → 万貴」。
 *   当初これを「もう渡してある。返してもらう」と読んで符号を逆に組み、上様に正されている。
 *   **「渡す人の振込が増える」** ―― これが正。迷ったら次の一行を思い出すこと：
 *     諒が万貴へ渡すなら、諒が口座へ多く入れ、万貴が少なく入れる。差額が万貴の手元に残る。
 *
 * ⚠ 2026-08-21 に**通算から精算月ごとへ改めた。** 振込額へ反映させるにあたり、
 *   他のすべてと同じく「どの精算に乗るか」で括らねば、締めた月の額が後から動いてしまうため。 */
function loanNet(list){
  let bal=0;
  (list||[]).forEach(x=>{
    if(!isLoan(x)) return;
    const a=Number(x.amount)||0;
    if(x.payer==="r" && x.burden==="m") bal+=a;
    else if(x.payer==="m" && x.burden==="r") bal-=a;
  });
  return bal;
}
function loanOf(m){ return loanNet(payItems(m)); }
/* 20日の締めで翌月へ送られたか（画面に印を出すため）。 */
function pushedOut(x){ return !normYM(x.pay) && x.payer!=="c" && !x.fixed && payOf(x)!==String(x.date||"").slice(0,7); }
/* 引落月が抜け落ちたまま入っている、取り込み済みの共有カード明細。
   ―― GAS側が古いまま（引落月の列を知らぬ版）で動いていると、送っても K列に残らず、
      取り込んだはずの月に「明細が1件もござらぬ」と鳴り続ける。設定から振り直せるようにした。 */
function needPay(){
  return S.items.filter(x => x.payer==="c" && !x.fixed && x.src==="CSV"
    && !normYM(x.pay) && String(x.date||"").length>=7);
}
function monthItems(m){ return S.items.filter(x=>String(x.date||"").slice(0,7)===m); }
function payItems(m){ return S.items.filter(x=>payOf(x)===m); }

/* 精算は毎月20日。ゆえに引落月は次のように決まる。
     共有カード          … 取り込みが刻んだ請求月（月末締め・翌26日払い）
     それ以外の20日より前 … その月の精算
     それ以外の20日以降   … **翌月の精算**（その月の振り込みにはもう間に合わぬ） */

/**
 * 精算の考え方（2026-08-18 上様の指図により改訂）
 *
 * 按分比が効くのは **毎月の固定額（二人合わせて 25万）だけ**。
 * そこから足が出た共有の支払いは **折半**。
 *
 *   共有の支出 S に対し、はみ出し E = max(0, S − 固定額)
 *   受け持ち  = 固定額の按分ぶん + E/2
 *
 * その人が出した額 = 上乗せ（按分の外で入れている保険ぶんなど）
 *                  + 自分の財布で払った共有のもの（立替）
 *                  − 共有カードで払った自分個人のもの（持ち出し）
 *   ※ 按分ぶんの固定額は受け持ちと打ち消し合うので出てこない。
 *
 *   二人のあいだで動く額 = （諒の出し − 万貴の出し）÷ 2      ← 折半なので単純な半分
 *
 * この式なら、貸し借りが無い月は必ず 0 になる。
 * 保険のように「上乗せして入れ、共有カードで自分の分を払う」ものも、
 * 上乗せと持ち出しが打ち消し合ってちょうど 0 になる。
 */
/* 精算の勘定そのもの。渡された一覧に対して同じ算を行う。
   `summary()` は利用月の一覧を、`transfer()` は引落月の一覧を渡す。 */
function calcOn(m, list){
  const plan = planFor(m);
  /* ⚠ **貸借は勘定に入れぬ。** 家の金は動いておらぬゆえ、出費にも精算にも効かせない。
     ただし `list` そのものからは外さない ―― 履歴と最近の記録に出す要があるため。 */
  const fin = list.filter(x=>!isLoan(x));
  const amt = x => signed(x);            // ⚠ 入金は負として効く。ここが要

  const total  = fin.filter(x=>!isIn(x)).reduce((a,b)=>a+amt(b),0);   // 出費だけ。入金を差し引かぬ
  const income = fin.filter(x=>isIn(x)).reduce((a,b)=>a-amt(b),0);    // 入金（見せるため正の数で）
  const shared = fin.filter(x=>x.burden==="share").reduce((a,b)=>a+amt(b),0);

  const paidBy = k => fin.filter(x=>x.payer===k).reduce((a,b)=>a+amt(b),0);
  const lent   = k => fin.filter(x=>x.payer===k && x.burden==="share").reduce((a,b)=>a+amt(b),0);
  const took   = k => fin.filter(x=>x.payer==="c" && x.burden===k).reduce((a,b)=>a+amt(b),0);
  const personal = k => fin.filter(x=>x.burden===k).reduce((a,b)=>a+amt(b),0);

  const ratio = Number(plan.ratio);
  const contrib = contribOf(plan);
  const extra = {r:Number(plan.extra.r)||0, m:Number(plan.extra.m)||0};
  const lend = {r:lent("r"), m:lent("m")};
  const take = {r:took("r"), m:took("m")};
  const over = Math.max(0, shared - plan.base);              // 固定額から足が出たぶん
  const put  = {r:extra.r+lend.r-take.r, m:extra.m+lend.m-take.m};
  const settle = (put.r-put.m)/2;                            // 折半。正 = 万貴 → 諒
  /* 共有の支払いが固定額（25万）に届かぬ月は、按分の元を**実額まで下げる**（2026-08-19）。
     下げずに 25万 をそのまま按分すると、受け持ちが口座から出ていく額を上回り、
     余りがまるごともう一方へ寄って「諒 120,000／万貴 13,330」のような歪んだ額が出る。
     ―― 明細を取り込む前はどの月も家賃だけになるゆえ、必ずこれを踏む。
     足が出ている月は cap＝25万ゆえ、これまでと1円も変わらぬ。 */
  const cap  = Math.min(shared, plan.base);
  const due = { r: cap*ratio + over/2, m: cap*(1-ratio) + over/2 };

  /* 分析は出費の内訳を見るためのもの。入金と貸借は混ぜぬ。 */
  const byCat = {};
  fin.filter(x=>!isIn(x)).forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+amt(x); });

  /* 上乗せに見合う「共有カード払い・個人負担」がこの月にまだ無いぶん。
     ⚠ ここが残っていると、貸し借りが無くても精算額が出る。明細をまだ取り込んでいない月の印。 */
  const gap = {r:Math.max(0,extra.r-take.r), m:Math.max(0,extra.m-take.m)};
  return {plan,list,fin,total,income,shared,ratio,base:plan.base,cap,contrib,extra,lend,take,over,put,settle,due,byCat,gap,
          paid:{c:paidBy("c"),r:paidBy("r"),m:paidBy("m")},
          personal:{r:personal("r"),m:personal("m")}};
}

/* 利用月で見た姿 ―― 「その月にいくら使ったか」 */
function summary(m){ return calcOn(m, monthItems(m).concat(fixedFor(m))); }

/**
 * 引落月で見た姿 ―― 「その月、共有口座へいくら振り込むか」（2026-08-19 追加）
 *
 * 共有口座から出ていくのは **その月に引き落とされるカードの請求（個人の買い物も含む全額）＋ 家賃。**
 * 個人の買い物も口座からは出ていくので、その人が自分で埋めねばならぬ。
 *
 *   振込額 = 共有の受け持ち（25万の按分＋はみ出しの折半）
 *          + 自分が共有カードで買った個人のもの（持ち出し）
 *          − 自分の財布から出した共有のもの（立替。もう払っているぶん）
 *
 * 二人の振込額を足すと、口座へ入れるべき額（`put`）にちょうど一致する（`diff` で確かめている）。
 * `put` は 26日に出ていく額（`out`）＋ 月々の積立貯蓄の二人ぶん。積立が0なら `put === out`。
 */
function transfer(m){
  const c = calcOn(m, payItems(m).concat(fixedFor(m)));
  const out = c.shared - c.lend.r - c.lend.m + c.take.r + c.take.m;   // 口座から実際に出ていく額
  /* ⚠ はみ出しの折半で半円が出る。振込に小数は使えぬゆえ、
     諒のぶんを円に丸め、**残りをまるごと万貴のぶんにする。**
     こうしないと、両方を丸めたときに合計が口座から出る額と1円ずれる。 */
  /* 二人のあいだの貸し借りを、口座への振込で相殺する（2026-08-21 上様の指図により追加）。
   *
   * ⚠⚠ **これはゼロ和である。** 一方から引いた額がそのまま他方へ乗るだけで、
   *   口座へ入る総額は1円も変わらぬ。ゆえに
   *   **「二人の振込を足すと口座から出る額に一致する」という検算（`diff`）は崩れぬ。**
   *   （総額のほうへ足すと崩れる。そちらは決してやらぬこと）
   *
   * 正なら「諒 → 万貴」へ渡すぶん ―― **渡す諒が多く入れ、受け取る万貴が少なく入れる。**
   * 差額がそのまま万貴の手元に残り、渡したことになる。
   * `send.m` は `out − send.r` で出しているので、諒へ足せば自ずと万貴から引かれる。
   */
  const loan = loanNet(c.list);
  /* 月々の積立貯蓄（2026-08-22 上様の指図により追加）。
   * 旧Excelは 2026年6月から H3・H4 の**両方**に `+H5`(5,000) を足していた ――
   * 二人が同額ずつ口座へ余分に入れて貯めるもの。
   *
   * ⚠⚠ **これはゼロ和ではない。** 貸借と違い、二人の合計が 2×savings だけ増える。
   *   ゆえに検算の相手を `out` から **`put`（＝out ＋ 積立の二人ぶん）** に改めた。
   *   **`out` の意味は変えぬ** ―― 「26日に口座から出ていく額」であり、
   *   `bill.total + bill.other − bill.in === out` の突合に使うゆえ、ここへ積立を混ぜてはならぬ。 */
  const sv  = Math.max(0, Number(c.plan.savings)||0);
  const put = Math.round(out) + sv*2;
  const sr = Math.round(c.due.r + c.take.r - c.lend.r) + loan + sv;
  const send = { r: sr, m: put - sr };

  /* この月に共有カードから引き落とされる請求の内訳（2026-08-19 上様の求めにより追加）。
     家賃は共有口座から出るがカード払いではないゆえ、fixed を除いて数える。
     除かねば「カードのご請求」に家賃が紛れ込み、Vpassの請求額と合わなくなる。 */
  /* ⚠ 三つを混ぜてはならぬ。
       bill.total  … カードの請求（Vpassの請求額と突き合わせる数）。**返金を差し引いた正味**
       bill.refund … カード明細の返金行（マイナス行）。請求を減らす
       bill.in     … 共有口座への入金（保険金・助成金）。**カードの請求ではない**
     混ぜるとVpassの請求額と照らし合わせられなくなる。
     常に成り立つ検算： bill.total + bill.other − bill.in === out              */
  const amt2 = x => Number(x.amount)||0;
  const isCard = x => x.payer==="c" && !x.fixed && !isIn(x);
  const isRefund = x => x.payer==="c" && !x.fixed && isIn(x) && x.src==="CSV";
  const isInflow = x => x.payer==="c" && !x.fixed && isIn(x) && x.src!=="CSV";
  const sum = f => c.fin.filter(f).reduce((a,b)=>a+amt2(b),0);
  const refund = sum(isRefund);
  const bill = {
    total: sum(isCard) - refund,
    share: sum(x=>isCard(x)&&x.burden==="share"),
    r:     sum(x=>isCard(x)&&x.burden==="r"),
    m:     sum(x=>isCard(x)&&x.burden==="m"),
    n:     c.fin.filter(x=>isCard(x)||isRefund(x)).length,
    refund,
    in:    sum(isInflow),
    other: sum(x=>x.payer==="c"&&x.fixed)
  };
  return Object.assign(c, {send, out, put, savings:sv, bill, loan, diff: (send.r+send.m) - put});
}

/* ============================================================
   個人帳面 ― 収入の行き先を数える（資産タブ）
   ============================================================

   収入 ＝ 総支給から税・社会保険料を引いた額（持株の天引き分を含む）。
   これを次の五つに振り分ける。

     ① 家の受け持ち        … transfer(m).due[me]（共有の出費のうち自分の持ち分）
     ② 自分の消費          … 共有カードで買った自分個人のもの ＋ 個人帳面の「支出」
     ③ 貯蓄                … 共有の積立 ＋ 共有カード経由の積立 ＋ 口座を通らない積立 ＋ 投資口座への移動
     ④ 二人のあいだの受け渡し … 貸借の精算（振込に折り込まれている）
     ⑤ 未記録の手元        … 残り。まだ記録されていない使い道、または銀行に残った分

   ⚠ 時計は一つ。家に関わる金は transfer(m)＝精算月で数える。
     給与は「◯月分」の月に入れる（支給日が月末なら翌月の精算に効くが、ずれは許容している）。

   ⚠ 個人帳面の「支出」「収入」には、共有の家計簿へ記録済みのもの（自分の財布で立て替えた共有の物、
     20日の振込、共有口座に入った入金）を入れない。家に関わる出金（homeOut）として既に数えており、二重になる。
     入力画面に注意書きを出し、同じ額・近い日付の立て替えが共有側にあれば、保存時に確かめる。
   ⚠ 共有口座に入った自分の入金（保険金など。カード明細の返金は除く）は、消費のマイナスではなく収入に数える（takeIn）。
   ⚠ 費目「貯蓄」の個人の支出は、消費ではなく貯蓄に数える（積立は「移動」で記録するのが本来の形）。

   ⚠⚠ 検算（diff）：家に関わる出金は、振込 ＋ 立て替えで出る。
        send = due + take − lend + loan + sv   （transfer() の式）
        ゆえに  due + take + sv + loan  ＝  send + lend   が常に成り立つ。
     立て替え（lend）は自分の財布から出た金で、振込の側では差し引かれている。
     足して戻さないと、財布から出た分が「未記録」に混ざる。
     締めた月は send を控え（cfg.closed）から取るので、控えと現在の計算が違えば diff に出る。

   ⚠ 共有カードの明細が未取り込みの月は、家の受け持ちが歪む（家賃だけで按分するため）。
     sendCard() と同じ関門で、その月は家に関わる数字を出さない（ok=false）。 */
function myMe(){ return S.cfg.me==="m" ? "m" : "r"; }
const myAcct = id => S.my.accts.find(a=>a.id===id) || null;
const myIsInv = id => { const a=myAcct(id); return !!a && a.kind==="投資"; };
const mySum = list => list.reduce((a,b)=>a+(Number(b.amount)||0), 0);
function myMonthTx(m){ return S.my.tx.filter(x=>String(x.date||"").slice(0,7)===m); }

function mineFlow(m){
  const me=myMe();
  const t=transfer(m), cl=closedOf(m);
  const ok = !!cl || t.bill.n>0;
  const tx=myMonthTx(m);

  const income  = mySum(tx.filter(x=>x.type==="収入"));
  const direct  = mySum(tx.filter(x=>x.type==="収入" && myIsInv(x.acct)));     // 口座を通らずに投資へ入る分（持株の天引きなど）
  const mySpend = mySum(tx.filter(x=>x.type==="支出"));
  /* 費目「貯蓄」の支出は消費ではなく貯蓄に数える（支出の入力では選べないが、取り込みで入りうる）。
     現金は出ていくので mySpend には残し、行き先の側だけを貯蓄へ振る。 */
  const mySpendSave = mySum(tx.filter(x=>x.type==="支出" && x.cat==="貯蓄"));
  const movedIn  = mySum(tx.filter(x=>x.type==="移動" && myIsInv(x.to)   && !myIsInv(x.acct)));
  const movedOut = mySum(tx.filter(x=>x.type==="移動" && myIsInv(x.acct) && !myIsInv(x.to)));
  const movedNet = movedIn - movedOut;                                          // 投資口座への正味の拠出（取り崩しは差し引く）

  let due=0, takeOther=0, takeSave=0, takeIn=0, sv=0, loanOut=0, lend=0, send=0, homeOut=0, diff=0, residual=null;
  if(ok){
    send = cl ? (Number(cl[me])||0) : t.send[me];
    lend = t.lend[me];
    /* 締めた月の積立は、控え（cl.sv）を使う。期の積立をあとで変えても、振込（控え）は動かないため。
       古い控えには sv が無いので、そのときだけ現在の値を使う。 */
    sv   = (cl && cl.sv!=null) ? (Number(cl.sv)||0) : t.savings;
    loanOut = me==="r" ? t.loan : -t.loan;                 // 正 = 自分から相手へ渡すぶん
    const take = t.take[me];
    takeSave  = t.fin.filter(x=>x.payer==="c" && x.burden===me && x.cat==="貯蓄").reduce((a,b)=>a+signed(b), 0);
    /* 共有口座に入った自分の入金（保険金・助成金。カード明細の返金ではないもの）は、take を負に押し下げる。
       これは消費のマイナスではなく、自分の収入が共有口座に入ったものなので、収入へ移す。
       カード明細の返金（src==="CSV"）は、買い物の取り消しなので、消費のマイナスのままにする。 */
    takeIn = t.fin.filter(x=>x.payer==="c" && !x.fixed && x.burden===me && isIn(x) && x.src!=="CSV")
                  .reduce((a,b)=>a+(Number(b.amount)||0), 0);
    takeOther = take - takeSave;
    /* 端数は transfer() が一人目に寄せ、二人目を「合計 − 一人目」にしている。同じ丸め方に揃える。
       揃えないと、二人目だけ内訳が1円ずれる。 */
    due = me==="r" ? Math.round(t.due.r) : Math.round(t.due.r + t.due.m) - Math.round(t.due.r);
    homeOut = send + lend;
    diff = (due + take + sv + loanOut) - homeOut;
    residual = (income - direct) - homeOut - mySpend - movedNet;
  }
  const own = takeOther + takeIn + (mySpend - mySpendSave);
  const savings = sv + takeSave + mySpendSave + direct + movedNet;
  const incomeAll = income + takeIn;                       // 画面に出す収入。共有口座に入った自分の入金を含む
  const rate = (ok && incomeAll>0) ? savings/incomeAll : null;
  return {m, me, ok, closed:!!cl, income:incomeAll, incomeBook:income, takeIn, direct, mySpend, movedNet, due, takeOther, takeSave, sv, loanOut,
          lend, send, homeOut, diff, residual, own, savings, rate};
}

/* 明細CSVの店名は全角英数（ＡＭＡＺＯＮ・Ｓｕｉｃａ・ＪＲ）。辞書は半角で書きたい。
   ⚠ 両方を半角へ畳んでから照らすこと。畳まずに toLowerCase だけで比べると、
     半角で書いた語（Amazon・JR）は全角の店名に一件も当たらず、辞書が黙って死ぬ。 */
function fold(s){
  return String(s||"").replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\s\u3000]/g,"").toLowerCase();
}
function guessCat(shop){
  if(!shop) return "";
  const s=fold(shop);
  for(const d of (S.cfg.dict||[])) if(d.kw && s.includes(fold(d.kw))) return d.cat;
  return "";
}

/* 共有カードの明細を取り込むとき、個人の負担へ倒すべき店を見分ける。
   ⚠ `guessCat` と同じく上から順・最初に当たったものを採る。 */
function guessMine(shop){
  if(!shop) return "";
  const s=fold(shop);
  for(const d of (S.cfg.mine||[])) if(d.kw && s.includes(fold(d.kw))) return d.who;
  return "";
}

/* ---------- 重複判定 ----------
   レシートとカード明細から同じ買い物が二度入るのを防ぐ。
   金額が一致し、日付が3日以内で、店名が寄っていれば同じものと見立てる。 */

function normShop(s){
  return String(s||"")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s\-‐－―ー・（）()株式会社有限会社店]/g,"")
    .toLowerCase();
}
function dayDiff(a,b){
  const t=s=>new Date(s+"T00:00:00").getTime();
  return Math.abs(t(a)-t(b))/86400000;
}
function findDup(it, list){
  const n=normShop(it.shop);
  return list.find(x=>{
    if(x.id===it.id || x.fixed) return false;
    if(Number(x.amount)!==Number(it.amount)) return false;
    if(dayDiff(x.date,it.date)>3) return false;
    const m=normShop(x.shop);
    if(!n || !m) return true;                       // どちらかに店名が無ければ金額と日付で判じる
    return n===m || n.includes(m) || m.includes(n);
  }) || null;
}

/* 「今月、共有口座へいくら振り込むか」の札（2026-08-19 追加）
   ⚠ ここだけは**引落月**で数える。まとめの他の数字は利用月ゆえ、額は一致しない。それが正しい。 */
/* 上乗せの見張り。⚠ **引落月で見ること。**
   利用月で見ると、カードの利用日と引落月がずれている当月はいつも鳴ってしまう。 */
function gapWarn(m){
  const t=transfer(m);
  if(!(t.gap.r||t.gap.m)) return "";
  /* ⚠ 引落月が抜けているだけで、明細そのものは入っている月では黙る。
     billCard() が「引落月を振り直してくだされ」と告げるゆえ、ここで重ねて
     「まだ取り込んでおらぬ」と言うと、取り込んだ上様を惑わせる（2026-08-20 に実際そうなった）。 */
  if(needPay().some(x=>shiftMonth(String(x.date).slice(0,7),1)===m)) return "";
  return `<div class="warnbox">上乗せに見合う<b>共有カード払いの個人負担</b>が、
    ${ymLabel(m)}引落のぶんにまだ ${yen(t.gap.r||t.gap.m)} 足りており申さぬ。
    <b>この月に引き落とされる明細をまだ取り込んでおらぬ</b>と見え申す。
    このままでは振込額が ${yen((t.gap.r+t.gap.m)/2)} ずれ申すゆえ、設定 → カード明細CSV から取り込んでくだされ。</div>`;
}

/* 「この月、共有カードからいくら引き落とされるか」の札（2026-08-19 追加）
   ⚠ **引落月**で数える。まとめの他の数字は利用月ゆえ、額は一致せぬ。それが正しい。 */
function billCard(m){
  const t=transfer(m), N=S.cfg.names;
  if(!t.bill.n){
    return `<div class="warnbox">${ymLabel(m)}26日に引き落とされる<b>カード明細がまだ1件もござらぬ。</b>
      共有カードは使った月の翌月に引き落とされ申すゆえ、${ymLabel(shiftMonth(m,-1))}利用ぶんの明細を
      設定 → カード明細CSV から取り込んでくだされ。取り込むまで振込額は出せ申さぬ。
      ${needPay().some(x=>shiftMonth(String(x.date).slice(0,7),1)===m)
        ? `<br><br><b>いや、取り込みは済んでおり申す。</b>ただ、その明細に<b>引落月が入っており申さぬ。</b>
           設定 → <b>引落月の振り直し</b> から当て直してくだされ。` : ""}</div>`;
  }
  const b=t.bill;
  const chip=(lbl,v)=>v>0?`<span class="chip num">${esc(lbl)} ${yenPlain(v)}</span>`:"";
  return `<div class="bill">
    <div class="hd"><span class="ic">${icon("credit_card")}</span><div class="lbl">${ymLabel(m)}26日 引き落とし ―― 共有カードのご請求</div></div>
    <div class="big num">${yen(b.total)}</div>
    <div class="brk">${chip("共有",b.share)}${chip(N.r,b.r)}${chip(N.m,b.m)}<span class="chip num">${b.n}件</span></div>
    <div class="memo num">${b.refund?`返金 ${yen(b.refund)} を差し引いた正味の請求にござる。<br>`:""}これに家賃ほか ${yen(b.other)} を足し${b.in?`、共有口座への入金 ${yen(b.in)} を差し引い`:""}た <b>${yen(t.out)}</b> が、この日に共有口座から出ていき申す。</div>
  </div>`;
}

/* 🏦 精算の札。
 *
 * 締めた月（`cfg.closed[m]`）は**控えた額をそのまま見せる。算し直さない。**
 * ―― 振り込んだ後で按分比や固定費を直しても、既に動いた金は変わらぬのが道理ゆえ。
 * 締めておらぬ月は、いま乗っているもので算した見込みを見せ、「精算した」の札を出す。
 */
function sendCard(m){
  const N=S.cfg.names, done=closedOf(m);

  if(done){
    const one=(k)=>`<div><div class="who">${esc(N[k])}</div><div class="amt num">${yen(Math.max(0,done[k]||0))}</div></div>`;
    return `<div class="send done">
      <div class="hd"><span class="ic">${icon("check_circle")}</span><div class="lbl">${ymLabel(m)}の精算 ―― 済んでござる</div></div>
      <div class="two">${one("r")}${one("m")}</div>
      <div class="memo num">${esc(String(done.on||"").replace(/-/g,"/"))} に締め申した。
        口座から出るのは ${yen(done.out||0)}${done.sv?`、ほかに<b>積立貯蓄</b> ${yenPlain(done.sv)}×2 が残り申す`:""}。この月の記録は凍らせてあり、
        あとから足したものは次の精算へ回り申す。
        <button class="mini ghost" data-open="reopen">締めを解く</button></div>
    </div>`;
  }

  const t=transfer(m);
  /* ⚠ その月に引き落とされるカード明細が1件も無いなら、まだ取り込んでおらぬ月。
     家賃だけで按分すると嘘の額（歪んだ片寄り）が出るゆえ、**黙って見せぬ。**
     代わりに billCard() が「取り込んでくだされ」と告げる。 */
  if(!t.list.length || !t.bill.n) return "";
  const one=(k)=>`<div><div class="who">${esc(N[k])}</div><div class="amt num">${yen(Math.max(0,t.send[k]))}</div></div>`;
  const back=(k)=>t.send[k]<0 ? `${esc(N[k])}は ${yen(-t.send[k])} 受け取る側にござる。` : "";
  /* 精算日を過ぎており、かつ前の月まで締んでいるなら、締めを促す。 */
  const due = today() >= m+"-"+String(settleDay()).padStart(2,"0");
  return `<div class="send">
    <div class="hd"><span class="ic">${icon("account_balance_wallet")}</span><div class="lbl">${ymLabel(m)}${settleDay()}日 精算 ―― 共有口座へ振り込む額</div></div>
    <div class="two">${one("r")}${one("m")}</div>
    <div class="memo num">この口座からは、のちの26日に ${yen(t.out)} が出てゆき申す
      ―― この月に引き落とされるカードと家賃。${t.savings
        ? `二人の振込 ${yen(t.put)} との差 ${yen(t.savings*2)} は<b>積立貯蓄</b>（一人 ${yenPlain(t.savings)} ずつ）として口座に残り申す。`
        : "二人の振込を足すとちょうど同じ額になり申す。"}
      ${t.loan?`<br>二人のあいだの貸し借り ${yen(Math.abs(t.loan))} を折り込んだ額にござる（合計は変わらず）。`:""}
      ${back("r")}${back("m")}</div>
    <button class="settle ${due?"":"ghost"}" data-open="close">${due?"振り込んだ ―― この月を締める":"先んじて締める"}</button>
  </div>`;
}

/* 🤝 二人のあいだの受け渡し（2026-08-21 追加・同日に向きを正した）
   ⚠ **渡す人の振込が増え、受け取る人の振込が減る。** 差額が受け取る人の手元に残る。
     ゼロ和ゆえ二人の合計は動かず、`diff` の検算も崩れぬ。 */
function loanCard(m){
  const bal=loanOf(m), N=S.cfg.names, done=closedOf(m);
  if(!bal) return "";
  const from = bal>0 ? N.r : N.m, to = bal>0 ? N.m : N.r;   // 正 = 諒 → 万貴
  const a=Math.abs(bal);
  return `<div class="loan${done?" done":""}">
    <div class="hd"><span class="ic">${icon("handshake")}</span><div class="lbl">${ymLabel(m)}の精算で 二人のあいだを動かす金</div></div>
    <div class="big num">${esc(from)} → ${esc(to)}　${yen(a)}</div>
    <div class="memo">${done
      ? `${ymLabel(m)}の精算で渡し終えてござる。`
      : `<b>今月の出費には入っており申さぬ</b>が、<b>振込額に折り込んでござる</b> ――
         渡す${esc(from)}の振込が ${yen(a)} <b>多く</b>、受け取る${esc(to)}の振込が ${yen(a)} <b>少なく</b>なってござる。
         その差が${esc(to)}の手元に残り申す。二人の合計は変わり申さぬ。
         <br>口座を通さず<b>直に手渡しした</b>なら
         <button class="mini ghost" data-open="clear">こちらで消す</button>`}</div>
  </div>`;
}

function viewHome(){
  const s=summary(S.month), prev=summary(shiftMonth(S.month,-1)), N=S.cfg.names;
  let cmp="";
  if(prev.total>0){
    const d=s.total-prev.total;
    cmp = d===0 ? "先月と同じ" : "先月より "+yen(Math.abs(d))+(d<0?" 少ない":" 多い");
  }
  const recent = s.list.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6);
  /* 入金は出費と足し引きせず、別行で添える。**差引の純額を出すと実際の出費が分からなくなる。** */
  const inc = s.income ? `・入金 ${yen(s.income)}` : "";

  const side = (k,cls)=>`<div class="tile t-${cls}">
      <div class="lbl">${esc(N[k])}</div>
      <div class="val num">${s.put[k]>0?"+":s.put[k]<0?"−":""}${yen(Math.abs(s.put[k])).slice(2)}</div>
      <div class="sub2 num">立替 ${yenPlain(s.lend[k])}・持ち出し ${yenPlain(s.take[k])}${s.extra[k]?"・上乗せ "+yenPlain(s.extra[k]):""}</div></div>`;

  return header() + `<div class="wrap">
    <div class="hero">
      <div class="lbl">今月の出費</div>
      <div class="big num">${yen(s.total)}</div>
      <div class="sub num">うち共有 ${yen(s.shared)}${inc}${cmp?"・"+cmp:""}</div>
    </div>
    <div class="grid2">${side("r","teal")}${side("m","pink")}</div>
    ${billCard(S.month)}
    ${sendCard(S.month)}
    ${loanCard(S.month)}
    ${gapWarn(S.month)}
    <div class="sechead"><h2>最近の記録</h2>${s.list.length>6?'<button class="more" data-tab="list">すべて見る</button>':''}</div>
    <div class="card">${recent.length?recent.map(rowHTML).join(""):emptyHTML("まだ記録がござらぬ","＋ から入れてくだされ")}</div>
  </div>`;
}

function rowHTML(x){
  const c=catOf(x.cat), N=S.cfg.names;
  const d=String(x.date||"").split("-");
  const loan=isLoan(x), inn=isIn(x);
  /* 貸借は「どこから払ったか／誰の分か」ではなく「誰から誰へ」と読む。同じ2列を向きとして使う。 */
  const pay = loan ? "" : `<span class="tag ${x.payer||"c"}">${esc(inn?inLabel(x.payer):payerLabel(x.payer))}</span>`;
  const bur = (loan||x.burden==="share") ? "" : `<span class="tag ${x.burden}">${esc(burdenLabel(x.burden))}</span>`;
  /* 20日の締めで翌月の精算へ回ったものには印を出す。黙って月をまたぐと勘定が合わぬように見える。 */
  const nxt = pushedOut(x) ? `<span class="tag gray">翌月精算</span>` : "";
  const knd = inn  ? `<span class="tag in">入金</span>`
            : loan ? `<span class="tag gray">${esc(N[x.payer]||"")}→${esc(N[x.burden]||"")} へ渡す</span>` : "";
  return `<div class="row" ${x.fixed?"":`data-edit="${esc(x.id)}"`}>
    <div class="ic-circle${loan||inn?" accent":""}">${icon(loan?"handshake":inn?"payments":c.ic)}</div>
    <div class="body">
      <div class="t1">${esc(x.shop||x.cat)}${x.fixed?' <span class="tag gray">固定</span>':''}</div>
      <div class="t2">${d[1]?Number(d[1])+"/"+Number(d[2]):""}${loan?"":"・"+esc(x.cat)}${knd}${pay}${bur}${nxt}</div>
    </div>
    <div class="amt num ${inn?"plus":""}">${inn?"＋":""}${yen(x.amount)}</div>
  </div>`;
}
function emptyHTML(a,b){ return `<div class="empty"><span class="e-ic">${icon("inbox")}</span>${esc(a)}<br>${esc(b)}</div>`; }

function viewStats(){
  const s=summary(S.month), N=S.cfg.names;
  const cats=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  const max=cats.length?cats[0][1]:1;
  const months=[]; for(let i=5;i>=0;i--) months.push(shiftMonth(S.month,-i));
  const totals=months.map(m=>summary(m).total);
  const mmax=Math.max(...totals,1);

  return header() + `<div class="wrap">
    <div class="sechead"><h2>誰の負担か</h2></div>
    <div class="card">
      ${[["共有",s.shared,"primary"],[N.r+" 個人",s.personal.r,"secondary"],[N.m+" 個人",s.personal.m,"tertiary"]].map(([k,v,c])=>{
        const pc=s.total?Math.round(v/s.total*100):0;
        return `<div class="barrow"><div class="bh"><span class="nm">${esc(k)}</span>
          <span><span class="vl num">${yen(v)}</span><span class="pc num">${pc}%</span></span></div>
          <div class="track"><div class="fill" style="width:${s.total?(v/s.total*100).toFixed(1):0}%;background:var(--m-${c})"></div></div></div>`;
      }).join("")}
      <div class="note num">支払元の内訳 ―― 共有カード ${yen(s.paid.c)}／${esc(N.r)} ${yen(s.paid.r)}／${esc(N.m)} ${yen(s.paid.m)}</div>
      <div class="note num">共有の受け持ち ―― ${esc(N.r)} ${yen(s.due.r)}／${esc(N.m)} ${yen(s.due.m)}。
      ${s.cap<s.base?`この月の共有 ${yen(s.cap)}`:`固定額 ${yen(s.base)}`} を ${Math.round(s.ratio*100)}：${100-Math.round(s.ratio*100)} で按分し、
      ${s.over>0?`足が出た ${yen(s.over)} を折半`:`足は出ており申さぬ`}。</div>
      ${(s.gap.r||s.gap.m) ? `<div class="warnbox">上乗せに見合う<b>共有カード払いの個人負担</b>が、この月にはまだ
        ${yen(s.gap.r||s.gap.m)}ぶん足りており申さぬ。<b>カード明細をまだ取り込んでおらぬ月</b>と見え申す。
        このままだと精算が ${yen((s.gap.r+s.gap.m)/2)} ずれ申すゆえ、明細を取り込んでくだされ。</div>` : ""}
    </div>

    <div class="sechead"><h2>費目の内訳</h2></div>
    <div class="card">${cats.length?cats.map(([k,v],i)=>{
      const c=catOf(k), pc=s.total?Math.round(v/s.total*100):0;
      return `<div class="barrow">
        <div class="bh"><span class="nm">${icon(c.ic,"s18")}${esc(k)}</span>
          <span><span class="vl num">${yen(v)}</span><span class="pc num">${pc}%</span></span></div>
        <div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%;background:${toneOf(i)}"></div></div>
      </div>`;
    }).join(""):emptyHTML("この月の記録がござらぬ","")}</div>

    <div class="sechead"><h2>6ヶ月の推移</h2></div>
    <div class="card">
      <div class="mbars">${months.map((m,i)=>{
        const h=Math.max(4, Math.round(totals[i]/mmax*104));
        return `<div class="mbar"><div class="bb ${m===S.month?"":"dim"}" style="height:${h}px"></div>
          <div class="ml">${Number(m.split("-")[1])}月</div></div>`;
      }).join("")}</div>
      <div class="note num">最も多い月：${yen(mmax)}</div>
    </div>
  </div>`;
}

function viewList(){
  const s=summary(S.month);
  /* 貸借と入金も並べて見せる（直せるように）。ただし**日ごとの合計には混ぜぬ。**
     出費だけを足す ―― 混ぜると、その日いくら使ったのかが分からなくなる。 */
  const list=s.list.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const spend=x=>(isLoan(x)||isIn(x))?0:(Number(x.amount)||0);
  const byDate={}; list.forEach(x=>{ (byDate[x.date]=byDate[x.date]||[]).push(x); });
  const keys=Object.keys(byDate).sort().reverse();
  return header() + `<div class="wrap">
    <div class="sechead"><h2>${list.length} 件・出費 ${yen(s.total)}${s.income?"・入金 "+yen(s.income):""}</h2></div>
    ${keys.length?keys.map(d=>{
      const day=byDate[d], sum=day.reduce((a,b)=>a+spend(b),0);
      const dd=d.split("-"), w=["日","月","火","水","木","金","土"][new Date(d).getDay()];
      return `<div class="sechead"><h2>${Number(dd[1])}/${Number(dd[2])}（${w}）</h2><span class="more num">${sum?yen(sum):""}</span></div>
        <div class="card">${day.map(rowHTML).join("")}</div>`;
    }).join(""):`<div class="card">${emptyHTML("この月の記録がござらぬ","＋ から入れてくだされ")}</div>`}
  </div>`;
}

/* ---------- 資産タブ（個人帳面） ----------

const syen = v => (v<0 ? "−" : "") + yen(Math.abs(v));
function myAcctName(id){ const a=myAcct(id); return a ? a.name : ""; }

function myRowHTML(x){
  const d=String(x.date||"").split("-");
  const mv=x.type==="移動", inc=x.type==="収入";
  const ic = inc ? "payments" : mv ? "swap_horiz" : catOf(x.cat).ic;
  const t1 = x.shop || (mv ? `${myAcctName(x.acct)||"元は未指定"} → ${myAcctName(x.to)||x.to}` : x.cat);
  const acctTag = (!mv && x.acct) ? `<span class="tag gray">${esc(myAcctName(x.acct)||x.acct)}</span>` : "";
  return `<div class="row" data-medit="${esc(x.id)}">
    <div class="ic-circle${inc||mv?" accent":""}">${icon(ic)}</div>
    <div class="body">
      <div class="t1">${esc(t1)}</div>
      <div class="t2">${d[1]?Number(d[1])+"/"+Number(d[2]):""}・${esc(mv?"移動":(x.cat||x.type))}${acctTag}</div>
    </div>
    <div class="amt num ${inc?"plus":""}">${inc?"＋":""}${yen(x.amount)}</div>
  </div>`;
}

function viewMine(){
  const m=S.month, f=mineFlow(m), N=S.cfg.names, who=N[myMe()];
  const rateTxt = f.rate==null ? "―" : Math.round(f.rate*100)+"%";
  const conn = S.cfg.mineApi ? "" :
    `<div class="warnbox">個人帳面にはまだ接続していません。いまの記録はこの端末にだけ保存されます。
      <button class="mini" data-open="m-conn" style="margin-left:6px">接続する</button></div>`;
  const err = (S.cfg.mineApi && !S.my.online && !S.my.syncing && S.my.err)
    ? `<div class="warnbox">個人帳面と通信できません（${esc(S.my.err)}）。表示は前回の控えです。</div>` : "";
  const unk = f.ok ? "" :
    `<div class="warnbox">${ymLabel(m)}に引き落とされる共有カードの明細が、共有の家計簿にまだありません。
      家の受け持ちを正しく計算できないため、この月は貯蓄率と「未記録の手元」を出しません。
      「自分の消費」「貯蓄」は、個人帳面に記録したものだけの値です。</div>`;

  const rows=[];
  if(f.ok) rows.push({k:"家の受け持ち", v:f.due, c:"var(--ramp-3)"});
  /* 明細が未取り込みの月は、共有カード経由の消費・積立が分からない。個人帳面の記録だけの値だと断る。 */
  const only = f.ok ? "" : "（個人帳面の記録のみ）";
  rows.push({k:"自分の消費"+only, v:f.own, c:"var(--ramp-4)"});
  rows.push({k:"貯蓄"+only, v:f.savings, c:"var(--ramp-1)"});
  if(f.ok && f.loanOut) rows.push({k:"二人のあいだの受け渡し", v:f.loanOut, c:"var(--ramp-5)"});
  if(f.ok) rows.push({k:"未記録の手元", v:f.residual, c:"var(--m-outline)"});
  const den=Math.max(f.income, ...rows.map(r=>Math.max(0,r.v)), 1);
  const bars=rows.map(r=>`<div class="barrow">
      <div class="bh"><span class="nm">${esc(r.k)}</span>
        <span><span class="vl num">${syen(r.v)}</span><span class="pc num">${f.income>0?Math.round(r.v/f.income*100)+"%":""}</span></span></div>
      <div class="track"><div class="fill" style="width:${(Math.max(0,r.v)/den*100).toFixed(1)}%;background:${r.c}"></div></div>
    </div>`).join("");

  /* 検算：家に関わる出金（振込 ＋ 立て替え）と、内訳の合計が合うこと。 */
  const chk = !f.ok ? "" : (Math.abs(f.diff)<=1
    ? `<div class="note num">家に関わる出金 ${yen(f.homeOut)}（振込 ${yen(f.send)} ＋ 立て替え ${yen(f.lend)}）は、家の受け持ち・共有カード経由の消費・積立・受け渡しの合計と一致しています。</div>`
    : `<div class="warnbox">家に関わる出金（振込 ＋ 立て替え）は ${yen(f.homeOut)} ですが、内訳の合計と ${syen(f.diff)} の差があります。
        ${f.closed?"締めた月の控えと、現在の計算が食い違っている可能性があります。":"共有の家計簿の記録を確かめてください。"}</div>`);

  const parts=[["共有の積立貯蓄（毎月）",f.sv],["共有カード経由の積立（SBI証券など）",f.takeSave],
               ["口座を通らない積立（持株の天引きなど）",f.direct],["投資口座への移動",f.movedNet]].filter(p=>p[1]);
  const partsHTML = parts.length
    ? parts.map(([k,v])=>`<div class="setrow"><div class="sl">${esc(k)}</div><div class="num amt-nw">${syen(v)}</div></div>`).join("")
    : emptyHTML("この月の貯蓄の記録はありません","");

  const months=[]; for(let i=5;i>=0;i--) months.push(shiftMonth(m,-i));
  const fl=months.map(mineFlow);
  /* 明細が未取り込みの月（ok=false）は、積立の一部しか分からない。棒を描かず、他の月と並べて比べさせない。 */
  const smax=Math.max(...fl.filter(x=>x.ok).map(x=>x.savings),1);
  const trend=fl.map((x,i)=>{
    const h = x.ok ? Math.max(4, Math.round(Math.max(0,x.savings)/smax*104)) : 4;
    return `<div class="mbar"><div class="bb ${months[i]===m && x.ok ?"":"dim"}" style="height:${h}px"></div>
      <div class="ml">${Number(months[i].split("-")[1])}月<span class="rt num">${x.rate==null?"–":Math.round(x.rate*100)+"%"}</span></div></div>`;
  }).join("");

  const list=myMonthTx(m).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  return header(true) + `<div class="wrap">
    ${conn}${err}
    <div class="hero">
      <div class="lbl">${esc(who)}の貯蓄率 ― ${ymLabel(m)}</div>
      <div class="big num">${rateTxt}</div>
      <div class="sub num">収入 <b>${yen(f.income)}</b>　貯蓄 <b>${f.ok?yen(f.savings):"―"}</b>${f.income>0?"":"<br>この月の収入はまだ記録されていません。"}</div>
    </div>
    ${unk}
    <div class="sechead"><h2>収入の行き先</h2></div>
    <div class="card">${bars}</div>
    ${chk}
    <div class="note">収入は、総支給から税・社会保険料を引いた額（持株の天引き分を含む）です。共有口座に入った自分の入金（保険金など）も含めます。
      個人帳面の支出・収入には、<b>共有の家計簿に記録した立て替えや20日の振込を入れないでください</b>（二重に数えます）。
      「未記録の手元」は、まだ記録されていない使い道（個人のカード・財布・現金の支出）と、銀行に残った分の合計です。記録が増えるほど小さくなります。</div>

    <div class="sechead"><h2>貯蓄の内訳</h2></div>
    <div class="card">${partsHTML}</div>

    <div class="sechead"><h2>6ヶ月の推移（貯蓄額と貯蓄率）</h2></div>
    <div class="card"><div class="mbars">${trend}</div></div>

    <div class="sechead"><h2>この月の個人の記録（${list.length}件）</h2><span class="more num">＋ から記録</span></div>
    <div class="card">${list.length?list.map(myRowHTML).join(""):emptyHTML("この月の個人の記録はありません","＋ から入れてください")}</div>
  </div>`;
}

let sheetCtx=null;

function openSheet(html, ctx){
  sheetCtx=ctx||null;
  document.getElementById("sheetin").innerHTML=html;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheetbg").classList.add("open");
  bindSheet();
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetbg").classList.remove("open");
  sheetCtx=null;
}
function sheetShell(title, body){
  return `<div class="grab"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="xbtn" data-close="1">${icon("close")}</button></div>${body}`;
}
function chipRow(id, items, cur, key){
  return `<div class="trio" id="${id}">${items.map(o=>`
    <button class="chip ${cur===o.k?"on":""}" data-${key}="${o.k}"
      style="${cur===o.k?chipStyle(o.cls):""}">${esc(o.label)}</button>`).join("")}</div>`;
}
/* 選んだチップの色。**役割色しか使わない** ―― 共有=primary / 諒=secondary / 万貴=tertiary。 */
function chipStyle(cls){
  const r={c:"primary",r:"secondary",m:"tertiary",in:"primary",loan:"tertiary"}[cls]||"primary";
  return `background:var(--m-${r}-container);color:var(--m-on-${r}-container)`;
}

/* 入力画面。**種別で問うことが変わる。**
     出費 … 費目・どこから払ったか・誰の分か
     入金 … 費目・どこへ入ったか・誰のものか（問いの向きが逆になるだけで、列は同じ）
     貸借 … 誰から誰へ渡すか、それだけ。費目は要らぬが**精算月は要る**（振込に折り込むゆえ） */
/* ⚠ 「→」だけでは「渡した」とも「返してもらう」とも読めてしまう。**「渡す」と言い切ること。** */
const LOAN_DIR = ()=>[{k:"r",label:S.cfg.names.r+" が "+S.cfg.names.m+" へ渡す",cls:"r"},
                      {k:"m",label:S.cfg.names.m+" が "+S.cfg.names.r+" へ渡す",cls:"m"}];

function editorHTML(it, dupWarn){
  const k=kindOf(it), loan=k==="貸借", inn=k==="入金";
  const title = it.id ? "記録を直す" : (loan?"貸し借りを記す":inn?"入金を記す":"記録する");
  const kindRow = it.id ? "" : `<div class="trio kinds" id="f-kind">
    ${[["","receipt_long","出費"],["入金","payments","入金"],["貸借","handshake","貸し借り"]].map(([v,ic,lbl])=>
      `<button class="chip ${k===v?"on":""}" data-kind="${v}"
        style="${k===v?chipStyle(v==="入金"?"in":v==="貸借"?"loan":"c"):""}">${icon(ic,"s18")}${lbl}</button>`).join("")}</div>`;

  return sheetShell(title, `
    ${kindRow}
    ${dupWarn||""}
    <div class="amtbox"><input id="f-amt" type="tel" inputmode="numeric" placeholder="0" value="${it.amount?yenPlain(it.amount):""}"></div>
    ${loan ? `
      <div class="note">二人のあいだで動かす金。<b>家の金は動いており申さぬ</b>ゆえ
      <b>今月の出費には入り申さぬ</b>が、<b>その月の振込額で受け渡しいたす</b> ――
      <b>渡す人の振込が増え、受け取る人の振込が減り</b>申す。二人の合計は変わり申さぬ。</div>
      <div class="flabel">誰から誰へ <span class="hint">口座を通して渡す向き</span></div>
      ${chipRow("f-dir", LOAN_DIR(), it.payer, "dir")}

function openEditor(item, extra){
  const it = item || {id:"",date:today(),cat:"食費",amount:0,payer:"c",burden:"share",shop:"",memo:"",kind:""};
  openSheet(editorHTML(it, extra&&extra.warn), {kind:"edit", it:Object.assign({},it), src:extra&&extra.src});
  setTimeout(()=>{ const a=document.getElementById("f-amt"); if(!it.id&&!it.amount&&a) a.focus(); },320);
}

function bindSheet(){
  const root=document.getElementById("sheetin");
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);

  const amt=root.querySelector("#f-amt");
  if(amt) amt.oninput=()=>{
    const n=amt.value.replace(/[^0-9]/g,"");
    amt.value = n?Number(n).toLocaleString("ja-JP"):"";
  };

  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    sheetCtx.it.cat=b.dataset.cat;
    root.querySelectorAll("[data-cat]").forEach(x=>{
      x.classList.toggle("on", x.dataset.cat===sheetCtx.it.cat);
    });
  });

  const pickRow=(sel,key,items)=>root.querySelectorAll(`[data-${key}]`).forEach(b=>b.onclick=()=>{
    sheetCtx.it[key]=b.dataset[key];
    root.querySelectorAll(`[data-${key}]`).forEach(x=>{
      const on=x.dataset[key]===sheetCtx.it[key];
      x.classList.toggle("on",on);
      x.style.cssText = on?chipStyle((items.find(o=>o.k===x.dataset[key])||{}).cls):"";
    });
  });
  if(root.querySelector("#f-payer")){
    pickRow("#f-payer","payer", isIn(sheetCtx.it)?IN_TO():PAYERS());
    pickRow("#f-burden","burden",BURDENS());
  }
  /* 貸借の向きは、支払元＝出した人／負担＝受け取る人 の2列で表す。列は増やさぬ。 */
  if(root.querySelector("#f-dir")){
    root.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{
      const v=b.dataset.dir;
      sheetCtx.it.payer=v; sheetCtx.it.burden = v==="r"?"m":"r";
      root.querySelectorAll("[data-dir]").forEach(x=>{
        const on=x.dataset.dir===v;
        x.classList.toggle("on",on);
        x.style.cssText = on?chipStyle(v):"";
      });
    });
  }
  /* 種別を切り替えたら、画面ごと組み直す（問う項目が変わるゆえ）。 */
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
    const it=sheetCtx.it, v=b.dataset.kind;
    it.kind=v;
    it.amount=Number(String((root.querySelector("#f-amt")||{}).value||"").replace(/[^0-9]/g,""))||0;
    const sh=root.querySelector("#f-shop"); if(sh) it.shop=sh.value;
    if(v==="貸借"){ it.payer="r"; it.burden="m"; }
    else if(v==="入金"){ if(it.payer!=="r"&&it.payer!=="m") it.payer="c"; it.burden="share"; }
    else { it.burden = it.burden==="share"?"share":it.burden; }
    openSheet(editorHTML(it), {kind:"edit", it, src:sheetCtx.src});
  });

  /* 精算する月は、日付と支払元から決まる（20日の締め）。
     上様が自ら選び直すまでは、日付や支払元を変えるたびに追従させる。
     ―― 追従せぬと、8/25 と入れ直したのに精算月が8月のまま刻まれて黙ってずれる。 */
  const payEl=root.querySelector("#f-pay"), dateEl=root.querySelector("#f-date");
  if(payEl && dateEl){
    payEl.addEventListener("change", ()=>{ payEl.dataset.touched="1"; });
    const sync=()=>{
      if(payEl.dataset.touched) return;
      const v=defaultPay({date:dateEl.value||sheetCtx.it.date, payer:sheetCtx.it.payer});
      if(v) payEl.value=v;
    };
    dateEl.addEventListener("input", sync);
    root.querySelectorAll("[data-payer]").forEach(b=>b.addEventListener("click", ()=>setTimeout(sync,0)));
  }

  const shop=root.querySelector("#f-shop");
  if(shop) shop.onblur=()=>{
    const g=guessCat(shop.value);
    if(g && g!==sheetCtx.it.cat){
      const btn=root.querySelector(`[data-cat="${CSS.escape(g)}"]`);
      if(btn){ btn.click(); toast(sheetCtx && sheetCtx.kind==="mrec" ? g+" と判断しました" : g+" と見立て申した"); }
    }
  };

  const sv=root.querySelector("#f-save");
  if(sv) sv.onclick=async ()=>{
    const it=sheetCtx.it;
    const n=Number(String(root.querySelector("#f-amt").value).replace(/[^0-9]/g,""));
    if(!n){ toast("金額を入れてくだされ"); root.querySelector("#f-amt").focus(); return; }
    it.amount=n;
    it.shop=(root.querySelector("#f-shop")||{value:""}).value.trim();
    it.date=root.querySelector("#f-date").value||today();
    it.kind=kindOf(it);                       // 空 / 入金 / 貸借 に均す
    /* 既定（20日の締めで決まる月）と同じなら持たせない。ずれているときだけ刻む。
       ⚠ 利用月ではなく**既定**と比べること。20日以降のものは既定が翌月ゆえ、
         利用月と比べると触ってもおらぬのに引落月が刻まれてしまう。 */
    const pv=(root.querySelector("#f-pay")||{}).value||"";
    /* ⚠ 貸借も精算月を持つ（2026-08-21 改）。振込額へ折り込むようになったゆえ、
       どの月の精算に乗るかで括らねば、締めた月の額が後から動く。 */
    it.pay = (pv && pv!==defaultPay(it)) ? pv : undefined;
    it.memo=root.querySelector("#f-memo").value.trim();
    const isNew=!it.id;
    if(isNew){ it.id=uid(); it.src=sheetCtx.src||"手入力"; }
    closeSheet();
    await pushItem(isNew?"add":"update", it);
    if(it.shop && !guessCat(it.shop)) learnDict(it.shop, it.cat);
    toast(isNew?"入れ申した":"直し申した");
  };

  const dl=root.querySelector("#f-del");
  if(dl) dl.onclick=async ()=>{
    if(!confirm("この記録を消しまするか。")) return;
    const it=sheetCtx.it; closeSheet();
    await pushItem("delete", it); toast("消し申した");
  };

  bindConfigSheet(root);
  bindCsvSheet(root);
  bindReceiptSheet(root);
  bindMineSheet(root);
}

function learnDict(shop, cat){
  const kw=String(shop).trim();
  if(kw.length<2) return;
  S.cfg.dict.push({kw,cat}); saveCfg();
}

  if(kind==="clear"){

    const m=S.month, t=transfer(m), N=c.names;

    openSheet(sheetShell(ymLabel(m)+"の精算を締める", `
      <div class="note">この月ぶんを<b>共有口座へ振り込んだ</b>ら締めてくだされ。
      締めると額が控えとして残り、<b>あとから按分や固定費を直しても動き申さぬ。</b>
      以後に足した記録は、次の精算へひとりでに回り申す。</div>

      <div class="sumrow"><span>${esc(N.m)} が振り込む</span><b class="num">${yen(Math.max(0,t.send.m))}</b></div>
      ${t.savings?`<div class="sumrow"><span>うち積立貯蓄（一人ずつ）</span><b class="num">${yen(t.savings)}</b></div>`:""}
      <div class="sumrow big"><span>26日に口座から出る</span><b class="num">${yen(t.out)}</b></div>
      <div class="note num">この精算に乗っているのは <b>${t.list.filter(x=>!x.fixed).length}件</b>

      <div class="note">記録に刻んだ精算月は<b>そのまま残し申す。</b>

      <button class="save del" id="ro-go">締めを解く</button>`), {kind:"reopen", m});
  }
  /* 引落月の振り直し（2026-08-20 追加）
     共有カードは月末締め・翌月26日払いゆえ、引落月＝**利用月の翌月**で一意に決まる。
     ⚠ 当て直すのは「共有カード払い・CSVから取り込んだ・引落月を持たぬ」ものだけ。

  if(kind==="fixpay"){

    bad.forEach(x=>{ const k=String(x.date).slice(0,7); (byM[k]=byM[k]||[]).push(x); });
    const keys=Object.keys(byM).sort();
    openSheet(sheetShell("引落月を振り直す", `
      <div class="note">共有カードは<b>月末締め・翌月26日払い</b>にござる。

      ${keys.length ? keys.map(k=>{

function bindConfigSheet(root){
  const c=S.cfg;
  const num = el => Number(String(el.value).replace(/[^0-9.]/g,""))||0;

  /* 繋がらぬときの見立て（2026-08-21 追加）。
     URL・デプロイ・合言葉・帳面の版 ―― どこで詰まっているのかを順に当てる。
     ⚠ `ping` は合言葉を要らぬ用向きゆえ、URLとデプロイだけを先に切り分けられる。 */
  const tst=root.querySelector("#c-test");
  if(tst) tst.onclick=async ()=>{
    const box=root.querySelector("#c-diag");
    const api0=root.querySelector("#c-api").value.trim().replace(/\/exec.*$/,"/exec");
    const tok0=root.querySelector("#c-token").value.trim();
    if(!api0){ box.innerHTML=`<div class="warnbox">URLが空でござる。</div>`; return; }
    box.innerHTML=`<div class="note">試しており申す…</div>`;
    const hit = async (action, tok) => {
      const u = api0 + (api0.includes("?")?"&":"?") + "action="+encodeURIComponent(action)
              + "&token="+encodeURIComponent(tok||"");
      const res = await fetch(u, {redirect:"follow"});
      const txt = await res.text();
      if(!res.ok) throw new Error("HTTP "+res.status);
      try{ return JSON.parse(txt); }
      catch(e){ throw new Error(/<html|<!DOCTYPE/i.test(txt) ? "HTML" : "読めず"); }
    };
    const ng=(t,h)=>`<div class="warnbox"><b>${t}</b><br>${h}</div>`;

// 写真は長辺1600pxまで縮める。原寸のままだと送るのに時間がかかり、読み取りの精度も上がらぬ。
function shrinkImage(file, maxEdge){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error("写真が読めず"));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("写真が開けず"));
      img.onload=()=>{
        const sc=Math.min(1, maxEdge/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const url=cv.toDataURL("image/jpeg",0.82);
        resolve({dataUrl:url, base64:url.split(",")[1]});
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ---------- CSV取り込み ---------- */

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(ch!=="\r") cell+=ch;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

  openSheet(sheetShell("カード明細を取り込む", `

    どの列が何かは、この後この画面で選び申す。一度選べば次から覚えており申す。
    取り込んだ分はすべて<b>共有カード払い・共有の負担</b>として入り申すゆえ、個人のものは後から履歴で振り分けてくだされ。</div>
    <div class="field"><label>CSVファイル</label><input id="cv-file" type="file" accept=".csv,text/csv"></div>
    <div id="cv-body"></div>`), {kind:"csv"});
}

    const rd=new FileReader();
    rd.onload=()=>{
      const txt=rd.result;
      if(/�/.test(txt.slice(0,400))){      // 化けを見て読み直す(Shift_JISで落ちてくることが多い)
        const rd2=new FileReader();
        rd2.onload=()=>showCsvMap(parseCSV(rd2.result));
        rd2.readAsText(file,"Shift_JIS");
        return;
      }
      showCsvMap(parseCSV(txt));
    };
    rd.readAsText(file,"UTF-8");
  };

function showCsvMap(rows){
  if(!rows.length){ toast("中身が読めず"); return; }
  const width=Math.max(...rows.map(r=>r.length));
  const head=rows[0], saved=S.cfg.csvMap||{};
  const colOpts=sel=>Array.from({length:width},(_,i)=>
    `<option value="${i}" ${String(saved[sel])===String(i)?"selected":""}>${i+1}列目：${esc(String(head[i]||"").slice(0,12))}</option>`).join("");

  document.getElementById("cv-body").innerHTML=`
    <div class="scroller"><table class="csv"><tbody>${rows.slice(0,4).map(r=>
      `<tr>${Array.from({length:width},(_,i)=>`<td>${esc(String(r[i]||"").slice(0,14))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="flabel">どの列が何か</div>
    <div class="maprow"><span class="mk">日付</span><select id="m-date">${colOpts("date")}</select></div>
    <div class="maprow"><span class="mk">店名</span><select id="m-shop">${colOpts("shop")}</select></div>
    <div class="maprow"><span class="mk">金額</span><select id="m-amt">${colOpts("amt")}</select></div>
    <div class="maprow"><span class="mk">飛ばす行</span><select id="m-skip">
      ${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${String(saved.skip)===String(n)?"selected":""}>先頭 ${n} 行</option>`).join("")}</select></div>
    <div class="flabel">いつ共有口座から引き落とされる分か</div>
    <div class="maprow"><span class="mk">引落月</span><input id="m-pay" type="month" value="${guessPay(rows)}"></div>
    <div class="note">明細に載っている<b>利用日</b>と、口座から<b>出ていく日</b>はひと月ずれ申す（毎月26日引落）。
    振込額はこの引落月で数え申すゆえ、ここを違えると振込が合わなくなり申す。
    <b>Vpassで開いていた「◯年◯月お支払い分」と同じ月</b>を選んでくだされ。</div>
    <div id="cv-prev"></div>
    <button class="save" id="cv-go">取り込む</button>`;

  const readMap=()=>({
    date:Number(document.getElementById("m-date").value),
    shop:Number(document.getElementById("m-shop").value),
    amt:Number(document.getElementById("m-amt").value),
    skip:Number(document.getElementById("m-skip").value),
    pay:String(document.getElementById("m-pay").value||"")
  });
  const refresh=()=>{
    const list=csvToItems(rows,readMap());
    const fresh=list.filter(x=>!findDup(x,S.items));
    const sum=fresh.reduce((a,b)=>a+b.amount,0);
    /* ⚠ 見張り ―― 取り込む行が、その月の固定費と同じものを指していないか。
       ジムや保険を固定費にも入れたままだと二重に数え、精算が狂う（2026-08-18 に踏んだ）。 */
    const clash=[]; const seen={};
    fresh.forEach(x=>{
      const m=String(x.date).slice(0,7);
      (seen[m]=seen[m]||fixedFor(m)).forEach(f=>{
        if(f.payer==="c" && Number(f.amount)===Number(x.amount) && !clash.some(v=>v.f===f.shop))
          clash.push({f:f.shop, s:x.shop});
      });
    });
    const mine=fresh.filter(x=>x.burden!=="share").length;
    document.getElementById("cv-prev").innerHTML = list.length
      ? `<div class="card" style="margin-top:14px">${fresh.slice(0,5).map(rowHTML).join("")||emptyHTML("新しいものは無し","")}</div>
         <div class="note num">読めたもの ${list.length} 件のうち、新しいものは <b>${fresh.length} 件・${yen(sum)}</b>。
         ${list.length-fresh.length?`残り ${list.length-fresh.length} 件はすでに入っており申す。`:""}
         ${mine?`<br>うち <b>${mine}件</b>は「個人の負担に倒す店」に当たったゆえ、自動で個人の負担にいたす。`:""}</div>
         ${clash.length?`<div class="warnbox">取り込む行と<b>同じ額の固定費</b>がござる ――
           ${clash.slice(0,4).map(v=>esc(v.f)+"（明細では「"+esc(v.s)+"」）").join("、")}。
           <b>二重に数えて精算が狂い申す。</b>設定 → 固定費 から、その固定費を外してくだされ。</div>`:""}`
      : `<div class="note">その組み合わせでは1件も読めており申さぬ。列か、飛ばす行を変えてくだされ。</div>`;
    document.getElementById("cv-go").disabled = !fresh.length;
  };
  ["m-date","m-shop","m-amt","m-skip","m-pay"].forEach(id=>document.getElementById(id).onchange=refresh);

  if(!S.cfg.csvMap) autoGuess();
  refresh();

  document.getElementById("cv-go").onclick=async ()=>{
    const map=readMap();
    // ⚠ 引落月は覚えない。覚えると次の取り込みに古い月が紛れ込む。列と飛ばす行だけ。
    S.cfg.csvMap={date:map.date, shop:map.shop, amt:map.amt, skip:map.skip}; save("cfg",S.cfg);
    const fresh=csvToItems(rows,map).filter(x=>!findDup(x,S.items));
    closeSheet();
    await pushMany("add", fresh);          // ⚠ 1件ずつ送ると40件で40往復して待たされる
    toast(fresh.length+"件を取り込み申した");
  };

  function autoGuess(){
    const sample=rows.slice(0,12);
    let best={date:0, amt:width>1?width-1:0, shop:1}, dS=-1,aS=-1,sS=-1;
    for(let i=0;i<width;i++){
      let d=0,a=0,s=0;
      sample.forEach(r=>{
        const v=String(r[i]||"").trim(); if(!v) return;
        if(/^\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}/.test(v)) d++;
        if(/^[\-\d,]+$/.test(v) && v.replace(/[^0-9]/g,"").length>=2) a++;
        if(v.length>=3 && !/^[\d,\/\-]+$/.test(v)) s++;
      });
      if(d>dS){dS=d;best.date=i;} if(a>aS){aS=a;best.amt=i;} if(s>sS){sS=s;best.shop=i;}
    }
    document.getElementById("m-date").value=best.date;
    document.getElementById("m-amt").value=best.amt;
    document.getElementById("m-shop").value=best.shop;
    document.getElementById("m-skip").value = /^\d{4}/.test(String(rows[0][best.date]||""))?0:1;
  }
}


/* 明細のいちばん新しい利用日から、引き落とし月を当てる。
   月末締め・翌月26日払いゆえ「いちばん新しい利用日の翌月」。上様が画面で直せる。 */
function guessPay(rows){
  let mx="";
  rows.forEach(r=>r.forEach(v=>{
    const g=String(v||"").match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(g){ const s=g[1]+"-"+String(g[2]).padStart(2,"0")+"-"+String(g[3]).padStart(2,"0"); if(s>mx) mx=s; }
  }));
  return mx ? shiftMonth(mx.slice(0,7),1) : ym(new Date());
}
function csvToItems(rows,map){
  const out=[];
  rows.slice(map.skip).forEach(r=>{
    const m=String(r[map.date]||"").trim().match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(!m) return;
    const amt=Number(String(r[map.amt]||"").replace(/[^0-9\-]/g,""));
    if(!amt) return;
    const shop=String(r[map.shop]||"").trim();
    /* ⚠ マイナス行は**返品・返金**（2026-08-21 より取り込む）。
       金額は正のまま持ち、種別を `入金` にして符号を種別へ預ける。
       捨てていた頃は、取り込んだ合計が明細の合計と合わなかった。 */
    out.push({ id:uid(),
      date:m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0"),
      cat:guessCat(shop)||"その他", amount:Math.abs(amt),
      payer:"c", burden:guessMine(shop)||"share", shop, memo:"", src:"CSV",
      kind: amt<0 ? "入金" : "",
      pay: map.pay || undefined });
  });
  return out;
}

function acctOpts(sel, withNone){
  const list=S.my.accts.slice().sort((a,b)=>(a.dormant?1:0)-(b.dormant?1:0) || (a.order||0)-(b.order||0));
  /* 保存値が一覧に無いとき、先頭の口座へ黙って化けないよう、その値を残す。 */
  const lost = sel && !list.some(a=>a.id===sel) ? `<option value="${esc(sel)}" selected>（不明な口座：${esc(sel)}）</option>` : "";
  return (withNone?`<option value="">指定しない</option>`:"") + lost
    + list.map(a=>`<option value="${esc(a.id)}" ${a.id===sel?"selected":""}>${esc(a.name)}${a.dormant?"（休眠）":""}</option>`).join("");
}

      <div class="field"><label>${t==="収入"?"入った先":"払った元"}</label><select id="m-acct">${acctOpts(it.acct,true)}</select></div>

        <input id="f-shop" value="${esc(it.shop||"")}" placeholder="${t==="収入"?"給与":"店名など"}"></div>
      <div class="note">${t==="収入"
        ? "共有口座に入った入金（保険金・助成金など）は、共有の家計簿に記録します。ここには入れないでください。"

}
