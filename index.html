function bindMineSheet(root){
  const k = sheetCtx && sheetCtx.kind;
  if(!k) return;

  /* ---- 記録 ---- */
  if(k==="mrec"){
    root.querySelectorAll("[data-mtype]").forEach(b=>b.onclick=()=>{
      const it=sheetCtx.it, v=b.dataset.mtype;
      it.amount=Number(String((root.querySelector("#f-amt")||{}).value||"").replace(/[^0-9]/g,""))||0;
      const sh=root.querySelector("#f-shop"); if(sh) it.shop=sh.value;
      const dt=root.querySelector("#m-date"); if(dt && dt.value) it.date=dt.value;
      it.type=v; it.cat = v==="収入" ? "給与" : v==="支出" ? "食費" : "";
      if(v!=="移動") it.to="";
      openSheet(myEditorHTML(it), {kind:"mrec", it});
    });
    const sv=root.querySelector("#m-save");
    if(sv) sv.onclick=async ()=>{
      const it=sheetCtx.it;
      const n=Number(String(root.querySelector("#f-amt").value).replace(/[^0-9]/g,""));
      if(!n){ toast("金額を入力してください"); root.querySelector("#f-amt").focus(); return; }
      it.amount=n;
      it.shop=(root.querySelector("#f-shop")||{value:""}).value.trim();
      it.date=root.querySelector("#m-date").value||today();
      it.acct=(root.querySelector("#m-acct")||{value:""}).value;
      it.to = it.type==="移動" ? root.querySelector("#m-to").value : "";
      if(it.type==="移動"){
        if(!it.to){ toast("先の口座を選んでください"); return; }
        if(it.acct===it.to){ toast("元と先が同じです"); return; }
        it.cat="";
      }
      it.memo=root.querySelector("#m-memo").value.trim();
      /* 共有の家計簿に、同じ額・近い日付の記録があれば確かめる。
         立て替えや振込を個人帳面にも入れると、家に関わる出金と重なって二重に数えるため。 */
      if(!it.id && (it.type==="支出" || it.type==="収入")){
        const dup = S.items.find(x=>x.payer===myMe() && !x.fixed && !isLoan(x)
          && (it.type==="収入" ? isIn(x) : !isIn(x))
          && Number(x.amount)===n && dayDiff(x.date,it.date)<=3);
        if(dup && !confirm("共有の家計簿に、同じ額・近い日付の記録があります（"+(dup.shop||dup.cat)+"）。\n同じものを二重に記録すると、家に関わる出金と重なって数えます。それでも記録しますか。")) return;
      }
      const isNew=!it.id;
      if(isNew){ it.id=uid(); it.src="手入力"; }
      closeSheet();
      await pushMy(isNew?"add":"update", it);
      toast(isNew?"記録しました":"直しました");
    };
    const dl=root.querySelector("#m-del");
    if(dl) dl.onclick=async ()=>{
      if(!confirm("この記録を削除しますか。")) return;
      const it=sheetCtx.it; closeSheet();
      await pushMy("delete", it); toast("削除しました");
    };
  }

  /* ---- 接続 ---- */
  if(k==="m-conn"){
    const norm=u=>String(u||"").trim().replace(/\/exec.*$/,"/exec");
    root.querySelectorAll("[data-owner]").forEach(b=>b.onclick=()=>{
      sheetCtx.owner=b.dataset.owner;
      root.querySelectorAll("[data-owner]").forEach(x=>x.classList.toggle("on", x.dataset.owner===sheetCtx.owner));
    });
    /* ⚠ 共有の家計簿と同じURLは受け付けない。個人の記録が共有の明細の列へ書かれてしまう。 */
    const sameAsShared = u => !!u && !!S.cfg.api && u===norm(S.cfg.api);
    const sv=root.querySelector("#m-save-conn");
    if(sv) sv.onclick=async ()=>{
      const u=norm(root.querySelector("#m-api").value), tk=root.querySelector("#m-token").value.trim();
      if(sameAsShared(u)){ toast("共有の家計簿と同じURLです。個人帳面は別のスプレッドシートを使ってください"); return; }
      /* ⚠ 保存する前に、相手が個人帳面か確かめる。共有の家計簿の別のデプロイのURLを入れると、
         URLが違うので上の検査をすり抜け、個人の取引が共有の明細へ書かれてしまう。
         確認できないとき（圏外・URLの誤り）も保存しない。 */
      if(u){
        sv.disabled=true;
        try{
          const p = await mineHit(u, "ping", "");
          if(!p || p.kind!=="mine"){ toast("このURLは個人帳面ではありません。共有の家計簿のURLを入れていないか確認してください"); sv.disabled=false; return; }
        }catch(e){ toast("接続先を確認できませんでした。通信できる状態で、URLを確かめてもう一度お試しください"); sv.disabled=false; return; }
        sv.disabled=false;
      }
      S.cfg.mineApi=u; S.cfg.mineToken=tk; S.cfg.me=sheetCtx.owner||"r";
      save("cfg", S.cfg); closeSheet(); render();
      if(u){ toast("接続します"); await pullMine(); toast(S.my.online?"接続しました":"接続できません："+S.my.err); }
    };
    const tst=root.querySelector("#m-test");
    if(tst) tst.onclick=async ()=>{
      const box=root.querySelector("#m-diag");
      const u=norm(root.querySelector("#m-api").value), tk=root.querySelector("#m-token").value.trim();
      const ng=(t,h)=>`<div class="warnbox"><b>${t}</b><br>${h}</div>`;
      if(!u){ box.innerHTML=ng("URLが空です。",""); return; }
      if(sameAsShared(u)){ box.innerHTML=ng("共有の家計簿と同じURLです。","個人帳面は、別のスプレッドシートに作ったApps ScriptのURLを入れてください。"); return; }
      box.innerHTML=`<div class="note">確認しています…</div>`;
      const hit = (action, t) => mineHit(u, action, t);
      try{
        const p = await hit("ping","");
        if(p.kind!=="mine"){
          box.innerHTML=ng("このURLは個人帳面ではないようです。","共有の家計簿のURLを入れていないか確認してください。Code-mine.gs を貼ったスクリプトのURLが必要です。");
          return;
        }
      }catch(e){
        box.innerHTML = e.message==="HTML"
          ? ng("デプロイの「アクセスできるユーザー」が『全員』になっていません。","Apps Script → デプロイ → デプロイを管理 → 鉛筆 →「アクセスできるユーザー」を全員に。")
          : ng("URLに届きません（"+esc(e.message)+"）。","末尾が /exec のURLか、デプロイ済みかを確認してください。");
        return;
      }
      let j;
      try{ j = await hit("list", tk); }
      catch(e){ box.innerHTML=ng("URLは生きていますが、取引が読めません（"+esc(e.message)+"）。","setup() を実行したかを確認してください。"); return; }
      if(j.ok===false){
        box.innerHTML = /合言葉/.test(j.error||"")
          ? ng("URLは正しいですが、合言葉の問題です。（"+esc(j.error)+"）","スクリプト プロパティに TOKEN を登録し、アプリに同じ合言葉を入れてください。")
          : ng("個人帳面が断りました（"+esc(j.error||"")+"）。","「未対応の用向き」と出るなら、新バージョンでのデプロイがまだです。");
        return;
      }
      let a=null; try{ a = await hit("accounts", tk); }catch(e){}
      box.innerHTML = `<div class="warnbox" style="background:var(--m-primary-container);color:var(--m-on-primary-container)">
        <b>接続できました。</b>取引 ${(j.items||[]).length} 件、口座 ${a&&a.accounts?a.accounts.length:"?"} 件を確認しました。</div>`;
    };
  }

  /* ---- 口座 ---- */
  if(k==="m-accts"){
    const wrap=root.querySelector("#ma-list");
    const bindRow=row=>{
      row.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
      const del=row.querySelector("[data-adel]");
      if(del) del.onclick=()=>{
        const id=row.dataset.aid;
        if(S.my.tx.some(x=>x.acct===id||x.to===id)){ toast("取引で使われている口座は削除できません。休眠にしてください"); return; }
        if(row.dataset.new!=="1" && !confirm("この口座を削除しますか。")) return;
        row.remove();
      };
    };
    wrap.querySelectorAll(".acct-row").forEach(bindRow);
    root.querySelector("#ma-add").onclick=()=>{
      const tmp=document.createElement("div");
      tmp.innerHTML=acctRowHTML({id:"a"+uid(), name:"", kind:"銀行"}, true);
      const row=tmp.firstElementChild; wrap.appendChild(row); bindRow(row);
      row.querySelector('[data-f="name"]').focus();
    };
    root.querySelector("#ma-save").onclick=()=>{
      const list=[...wrap.querySelectorAll(".acct-row")].map((row,i)=>({
        id:row.dataset.aid,
        name:row.querySelector('[data-f="name"]').value.trim(),
        kind:row.querySelector('[data-f="kind"]').value,
        locked:row.querySelector('[data-flag="locked"]').classList.contains("on"),
        dormant:row.querySelector('[data-flag="dormant"]').classList.contains("on"),
        order:i+1
      }));
      if(list.some(a=>!a.name)){ toast("名称が空の口座があります"); return; }
      S.my.accts=list; saveMyAccts(); closeSheet(); render(); toast("口座を保存しました");
    };
  }

  /* ---- 給与の取り込み ---- */
  if(k==="m-sal"){
    const f=root.querySelector("#ms-file"), box=root.querySelector("#ms-body");
    f.onchange=()=>{
      const file=f.files[0]; if(!file) return;
      const rd=new FileReader();
      rd.onload=()=>{
        let j;
        try{ j=JSON.parse(String(rd.result).replace(/^﻿/,"")); }
        catch(e){ box.innerHTML=`<div class="warnbox">JSONとして読めませんでした。</div>`; return; }
        const src = Array.isArray(j && j.items) ? j.items : [];
        const ok=[]; let bad=0;
        src.forEach(x=>{ const v=normMyTx(x); if(v) ok.push(v); else bad++; });
        if(!ok.length){ box.innerHTML=`<div class="warnbox">取り込める取引がありませんでした（読めなかった行 ${bad} 件）。</div>`; return; }
        const cur={}; S.my.tx.forEach(x=>cur[x.id]=x);
        const same=(a,b)=>["date","type","amount","acct","to","cat","shop","memo","src"].every(q=>String(a[q]||"")===String(b[q]||""));
        const fresh=ok.filter(x=>!cur[x.id]);
        const chg=ok.filter(x=>cur[x.id] && !same(cur[x.id],x));
        const todo=fresh.concat(chg);
        const unk=[...new Set(ok.flatMap(x=>[x.acct,x.to]).filter(id=>id && !myAcct(id)))];
        const ms=ok.map(x=>x.date.slice(0,7)).sort();
        box.innerHTML=`
          <div class="note num">読み取れた ${ok.length} 件（${ymLabel(ms[0])}〜${ymLabel(ms[ms.length-1])}）のうち、
            新規 <b>${fresh.length}</b> 件・内容が変わったもの <b>${chg.length}</b> 件・変更なし ${ok.length-todo.length} 件です。</div>
          ${bad?`<div class="warnbox">形が合わず読めなかった行が ${bad} 件あります。</div>`:""}
          ${unk.length?`<div class="warnbox">口座の一覧にない口座があります：${unk.map(esc).join("、")}。取り込みはできますが、口座の画面で追加してください。</div>`:""}
          <button class="save" id="ms-go" ${todo.length?"":"disabled"}>${todo.length}件を取り込む</button>`;
        box.querySelector("#ms-go").onclick=async ()=>{
          closeSheet(); await pushMyMany(todo); toast(todo.length+"件を取り込みました");
        };
      };
      rd.readAsText(file,"UTF-8");
    };
  }
}

/* ---------- 繋ぎこみ ---------- */

function bindAll(){
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    S.month=shiftMonth(S.month,Number(b.dataset.mv)); render();
  });
  document.querySelectorAll("[data-edit]").forEach(r=>r.onclick=()=>{
    const it=S.items.find(x=>x.id===r.dataset.edit); if(it) openEditor(it);
  });
  document.querySelectorAll(".more[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.open;
    if(k==="csv") openCsv(); else if(k==="receipt") openReceipt();
    else if(k.indexOf("m-")===0) openMine(k);
    else openConfig(k);
  });
  document.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>pullAll());
  /* 設定は右上の歯車から開く（ナビは資産タブに譲った）。 */
  document.querySelectorAll(".gear").forEach(b=>b.onclick=()=>{ S.tab="settings"; render(); window.scrollTo(0,0); });
  document.querySelectorAll("[data-medit]").forEach(r=>r.onclick=()=>{
    const it=S.my.tx.find(x=>x.id===r.dataset.medit); if(it) openMyEditor(it);
  });
}

document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
/* 「＋」は、いま見ているタブの帳面へ記録する（資産タブなら個人帳面）。 */
document.getElementById("fab").onclick=()=>{ if(S.tab==="mine") openMyEditor(null); else openEditor(null); };
document.getElementById("sheetbg").onclick=closeSheet;

S.items=cached();
render();
pullAll();
window.addEventListener("online",()=>pullAll());

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
