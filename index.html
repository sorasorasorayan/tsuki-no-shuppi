<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7C6BF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="月の出費">
<title>月の出費</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#FFF9F2; --card:#FFFFFF; --card2:#F7F4EE;
  --ink:#2B2A28; --sub:#6E6B64; --muted:#A5A199;
  --line:#EFEAE1;
  --purple:#7C6BF0; --purple-bg:#EFEDFE; --purple-ink:#3F35A0;
  --teal:#17B183;  --teal-bg:#E2F6EF;  --teal-ink:#0B6A4E;
  --pink:#E4628F;  --pink-bg:#FDEBF1;  --pink-ink:#962E53;
  --amber:#F5A524; --amber-bg:#FEF3E0; --amber-ink:#8A5806;
  --blue:#3B8DED;  --blue-bg:#E8F2FD;  --blue-ink:#1B5497;
  --red:#EF5B5B;   --red-bg:#FDECEC;   --red-ink:#9C2A2A;
  --shadow:0 2px 10px rgba(43,42,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191816; --card:#242220; --card2:#2E2B28;
    --ink:#F2EFE9; --sub:#B4AFA6; --muted:#807B73;
    --line:#35322E;
    --purple-bg:#2E2A52; --purple-ink:#C3BBFB;
    --teal-bg:#123A2E;   --teal-ink:#7FE3C0;
    --pink-bg:#3D2029;   --pink-ink:#F6A7C3;
    --amber-bg:#3A2A11;  --amber-ink:#F8CE86;
    --blue-bg:#152C46;   --blue-ink:#9CC8F7;
    --red-bg:#3B1F1F;    --red-ink:#F6A2A2;
    --shadow:0 2px 10px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

header{padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-pick{display:flex;align-items:center;gap:10px}
.month-pick b{font-size:20px;font-weight:700;letter-spacing:.02em}
.arrowbtn{width:32px;height:32px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--sub)}
.arrowbtn:disabled{opacity:.3}
.pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--purple-bg);color:var(--purple-ink);margin-left:5px}
.pill.warn{background:var(--amber-bg);color:var(--amber-ink)}

.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:var(--purple-bg);border-radius:24px;padding:20px;margin-bottom:12px}
.hero .lbl{font-size:12px;font-weight:700;color:var(--purple-ink);opacity:.85}
.hero .big{font-size:34px;font-weight:800;color:var(--purple-ink);letter-spacing:-.02em;margin:2px 0 0}
.hero .sub{font-size:12px;color:var(--purple-ink);opacity:.8;margin-top:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:20px;padding:14px}
.tile .lbl{font-size:11px;font-weight:700;opacity:.9}
.tile .val{font-size:19px;font-weight:800;letter-spacing:-.01em}
.tile .sub2{font-size:10px;opacity:.75;margin-top:2px}
.t-teal{background:var(--teal-bg);color:var(--teal-ink)}
.t-pink{background:var(--pink-bg);color:var(--pink-ink)}

.settle{background:var(--amber-bg);color:var(--amber-ink);border-radius:20px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.settle .ic{font-size:22px}
.settle .lbl{font-size:11px;font-weight:700;opacity:.85}
.settle .val{font-size:16px;font-weight:800}
.settle.even{background:var(--teal-bg);color:var(--teal-ink)}
.bill{background:var(--blue-bg);color:var(--blue-ink);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.bill .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bill .hd .ic{font-size:20px}
.bill .hd .lbl{font-size:11px;font-weight:700;opacity:.85}
.bill .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.bill .brk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bill .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card)}
.bill .memo{font-size:11px;line-height:1.6;margin-top:9px;opacity:.85}
.send{background:var(--purple-bg);color:var(--purple-ink);border-radius:20px;padding:14px 16px;margin-bottom:16px}
.send .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.send .hd .ic{font-size:20px}
.send .hd .lbl{font-size:11px;font-weight:700;opacity:.85}
.send .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send .who{font-size:11px;font-weight:700;opacity:.8;margin-bottom:2px}
.send .amt{font-size:19px;font-weight:800;letter-spacing:-.4px}
.send .memo{font-size:11px;line-height:1.6;margin-top:10px;opacity:.85}

.sechead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sechead h2{font-size:13px;font-weight:700;color:var(--sub);margin:0;letter-spacing:.04em}
.sechead .more{font-size:12px;font-weight:700;color:var(--purple)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.ic-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 38px}
.row .body{flex:1;min-width:0}
.row .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:11px;color:var(--muted);margin-top:1px}
.row .amt{font-size:15px;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:5px;vertical-align:1px}
.tag.c{background:var(--purple-bg);color:var(--purple-ink)}
.tag.r{background:var(--teal-bg);color:var(--teal-ink)}
.tag.m{background:var(--pink-bg);color:var(--pink-ink)}
.tag.gray{background:var(--card2);color:var(--muted)}

.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13px}
.empty .e-ic{font-size:34px;display:block;margin-bottom:8px;opacity:.6}

.barrow{margin-bottom:14px}
.barrow .bh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.barrow .bh .nm{font-weight:600}
.barrow .bh .vl{font-weight:700}
.barrow .bh .pc{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
.track{height:9px;border-radius:999px;background:var(--card2);overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.3,1)}

.mbars{display:flex;align-items:flex-end;gap:6px;padding-top:6px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.mbar .bb{width:100%;background:var(--purple);border-radius:7px 7px 4px 4px;min-height:3px;transition:height .4s cubic-bezier(.2,.8,.3,1)}
.mbar .bb.dim{background:var(--purple-bg)}
.mbar .ml{font-size:10px;color:var(--muted);white-space:nowrap}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:40}
.navin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:end}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:10px;font-weight:600}
.nb .ni{font-size:20px;line-height:1}
.nb.on{color:var(--purple)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--purple);color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 6px 16px rgba(124,107,240,.4)}
.fab:active{transform:translateY(-14px) scale(.94)}

.sheet-bg{position:fixed;inset:0;background:rgba(20,18,16,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;z-index:51;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);max-height:94vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet-in{max-width:520px;margin:0 auto;padding:8px 16px 0}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font-size:17px;font-weight:700;margin:0}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub)}

.amtbox{background:var(--purple-bg);border-radius:22px;padding:16px;text-align:center;margin-bottom:16px}
.amtbox input{width:100%;border:none;background:none;text-align:center;font-size:36px;font-weight:800;color:var(--purple-ink);outline:none;letter-spacing:-.02em;padding:0}
.amtbox input::placeholder{color:var(--purple-ink);opacity:.3}
.flabel{font-size:12px;font-weight:700;color:var(--sub);margin:0 2px 8px}
.flabel .hint{font-weight:500;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:5px}
.chip.on{box-shadow:none}
.chip:active{transform:scale(.96)}
.trio{display:flex;gap:8px;margin-bottom:18px}
.trio .chip{flex:1;justify-content:center;padding:12px 6px;font-size:13px}
.field{background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:none;background:none;outline:none;padding:2px 0;font-size:15px}
.field textarea{resize:none;min-height:22px}
.save{width:100%;background:var(--teal);color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:999px;margin-top:6px}
.save:active{transform:scale(.98)}
.save.del{background:var(--red-bg);color:var(--red-ink);margin-top:10px;font-size:14px;padding:12px}
.save.ghost{background:var(--card2);color:var(--sub);margin-top:10px;font-size:14px;padding:12px}
.save:disabled{opacity:.45}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14px;font-weight:600}
.setrow .sd{font-size:11px;color:var(--muted);margin-top:1px}
.mini{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--purple-bg);color:var(--purple-ink);white-space:nowrap}
.mini.ghost{background:var(--card2);color:var(--sub)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
.dot.ok{background:var(--teal)} .dot.ng{background:var(--muted)} .dot.er{background:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;z-index:70;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

table.csv{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
table.csv td{border:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px}
.maprow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.maprow .mk{font-size:13px;font-weight:600;width:86px;flex:0 0 86px}
.maprow select{flex:1;background:var(--card);border:none;border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);outline:none}
.note{font-size:12px;color:var(--muted);line-height:1.65;margin:10px 2px}
.warnbox{background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:11px 14px;font-size:12px;line-height:1.6;margin-bottom:12px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb{width:100%;border-radius:16px;margin-bottom:12px;display:block}
</style>
</head>
<body>

<div id="app"></div>

<nav>
  <div class="navin">
    <button class="nb on" data-tab="home"><span class="ni">🏠</span>まとめ</button>
    <button class="nb" data-tab="stats"><span class="ni">📊</span>分析</button>
    <button class="fab" id="fab">＋</button>
    <button class="nb" data-tab="list"><span class="ni">📋</span>履歴</button>
    <button class="nb" data-tab="settings"><span class="ni">⚙️</span>設定</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   月の出費 — 二人でつける家計簿
   支払元(payer: c=共有カード / r / m) と 負担(burden: share / r / m) を
   別々に持つのが、この帳面の肝。旧Excelの負の数はこの区別が無かったせい。
   ============================================================ */

const CATS = [
  {k:"食費",   ic:"🍚", c:"blue"},
  {k:"日用品", ic:"🧺", c:"teal"},
  {k:"光熱費", ic:"💡", c:"amber"},
  {k:"通信",   ic:"📱", c:"purple"},
  {k:"住居",   ic:"🏠", c:"pink"},
  {k:"保険",   ic:"🛡️", c:"teal"},
  {k:"交通",   ic:"🚃", c:"blue"},
  {k:"医療",   ic:"💊", c:"red"},
  {k:"娯楽",   ic:"🎮", c:"purple"},
  {k:"衣服",   ic:"👕", c:"pink"},
  {k:"交際",   ic:"🎁", c:"amber"},
  {k:"その他", ic:"✨", c:"teal"}
];
const catOf = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];
const CVAR = {blue:"--blue",teal:"--teal",amber:"--amber",purple:"--purple",pink:"--pink",red:"--red"};

/* 期(いつからの決め事か)
   base   … 年収比で按分する固定額。二人合わせた額
   ratio  … その固定額のうち、一人目が持つ割合
   extra  … 按分の外で上乗せしている額(共有カード払いの個人保険など)
   これを足したものが、その人が毎月共有の財布へ入れる額になる。

   下の値は旧Excelから読み解いたもの。万貴の額は常に 250,000 の按分ちょうどで、
   諒だけが端数を上乗せしている ―― それが保険料と見られる。 */
const RENT = ()=>({name:"家賃",amount:133330,cat:"住居",payer:"c",burden:"share",on:true});
/* ⚠ ジム・保険を「固定費」に入れてはならぬ（2026-08-18 に踏んで直した）。
   これらは共有カードで払っており、明細CSVを取り込むと**実物の行として入ってくる**。
   固定費にも入れると二重になり、精算が上乗せの半分ぶん（8,143円）狂う。
   上乗せの相殺は、取り込んだ実物の行を個人負担へ倒すことで担う ―― その決まりが下の `mine`。
   家賃だけはカード払いでないので、固定費に入れておいてよい。 */
const DEFAULT_PLANS = [
  {from:"2025-03", base:250000, ratio:0.60, extra:{r:0,     m:0}, fixed:[RENT()]},
  {from:"2025-04", base:250000, ratio:0.56, extra:{r:0,     m:0}, fixed:[RENT()]},
  {from:"2025-09", base:250000, ratio:0.56, extra:{r:8400,  m:0}, fixed:[RENT()]},
  {from:"2025-10", base:250000, ratio:0.56, extra:{r:16285, m:0}, fixed:[RENT()]},
  {from:"2025-11", base:250000, ratio:0.48, extra:{r:16285, m:0}, fixed:[RENT()]}
];

const DEFAULT_CFG = {
  api:"", token:"",
  names:{r:"諒", m:"万貴"},
  plans: DEFAULT_PLANS,
  /* 共有カードで払っているが「その人の個人の負担」であるもの。
     明細CSVの取り込み時、この言葉が店名に含まれていたら負担をその人へ倒す。
     ⚠ 上乗せ(extra)を入れているなら、それに見合う額がここで倒れるようにしておくこと。
       倒れないと、貸し借りの無い月にも上乗せの半分が精算として出る。
       諒の上乗せ 16,285 ＝ ジム 8,400 ＋ メディケア 1,915 ＋ ＭｅｔＬｉｆｅ 5,970。
     根拠は 2026-08-18 の明細CSV 775行との突合（`CLAUDE.md` を見よ）。
     Suica は旧Excelで 91%(30/33)、SBI証券は投資ゆえ、いずれも個人と見立てている。 */
  mine:[
    {kw:"ＡＦ戸越公園",   who:"r"},
    {kw:"メディケア生命", who:"r"},
    {kw:"MetLife",        who:"r"},
    {kw:"メットライフ",   who:"r"},
    {kw:"Suica",          who:"r"},
    {kw:"SBI証券",        who:"r"}
  ],
  /* ⚠ 上から順に当たった最初のものを採る。**書く順が意味を持つ。**
     「ライフ」(スーパー)を「生命」より先に置くと、メットライフ生命が食費になる。
     語は 2026-08-18 に明細CSV 775行の実際の店名から起こした。 */
  dict:[
    {kw:"生命",cat:"保険"},{kw:"損害保険",cat:"保険"},{kw:"損保",cat:"保険"},{kw:"保険料",cat:"保険"},
    {kw:"Amazon Downloads",cat:"娯楽"},{kw:"GOOGLE PLAY",cat:"娯楽"},{kw:"GOOGLE GENSHIN",cat:"娯楽"},
    {kw:"Amazon",cat:"日用品"},{kw:"ヨドバシ",cat:"日用品"},{kw:"ニトリ",cat:"日用品"},
    {kw:"マツモトキヨシ",cat:"日用品"},{kw:"ツルハ",cat:"日用品"},{kw:"ドラッグ",cat:"日用品"},{kw:"ぱぱす",cat:"日用品"},
    {kw:"まいばすけっと",cat:"食費"},{kw:"文化堂",cat:"食費"},{kw:"マルエツ",cat:"食費"},
    {kw:"イオン",cat:"食費"},{kw:"セブン",cat:"食費"},{kw:"ローソン",cat:"食費"},
    {kw:"ファミリーマート",cat:"食費"},{kw:"サイゼリヤ",cat:"食費"},{kw:"ガスト",cat:"食費"},
    {kw:"スターバックス",cat:"食費"},{kw:"ほっともっと",cat:"食費"},{kw:"銀のさら",cat:"食費"},
    {kw:"ライフ",cat:"食費"},
    {kw:"東京電力",cat:"光熱費"},{kw:"東京ガス",cat:"光熱費"},{kw:"水道",cat:"光熱費"},
    {kw:"ドコモ",cat:"通信"},{kw:"ソフトバンク",cat:"通信"},{kw:"NTT",cat:"通信"},
    {kw:"ETC",cat:"交通"},{kw:"Suica",cat:"交通"},{kw:"タイムズ",cat:"交通"},
    {kw:"テスラ",cat:"交通"},{kw:"JR",cat:"交通"},{kw:"メトロ",cat:"交通"},
    {kw:"歯医者",cat:"医療"},{kw:"矯正歯科",cat:"医療"},{kw:"薬局",cat:"医療"},

function cached(){ return load("items", []); }
function setCached(list){ save("items", list); }

async function api(action, payload){
  const cfg=S.cfg;
  if(!cfg.api) throw new Error("未接続");
  const url = cfg.api + (cfg.api.includes("?")?"&":"?") + "action="+encodeURIComponent(action) + "&token="+encodeURIComponent(cfg.token||"");
  const opt = payload
    ? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow"}
    : {method:"GET", redirect:"follow"};
  const res = await fetch(url, opt);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  if(j.ok===false) throw new Error(j.error||"エラー");
  return j;
}

async function pullAll(){
  if(!S.cfg.api){ S.items=cached(); S.online=false; return; }
  S.syncing=true; render();
  try{
    await flushQueue();
    const j = await api("list");
    S.items = j.items||[]; setCached(S.items);
    S.online=true; S.err="";
    S.cfg.lastSync=new Date().toISOString(); save("cfg",S.cfg);
  }catch(e){
    S.items=cached(); S.online=false; S.err=e.message;
  }finally{ S.syncing=false; render(); }
}

async function flushQueue(){
  if(!S.cfg.api || !S.queue.length) return;
  const rest=[];
  for(const q of S.queue){
    try{ await api(q.action, q.payload); }catch(e){ rest.push(q); }
  }
  S.queue=rest; save("queue",S.queue);
}

async function pushItem(action, item){
  if(action==="add") S.items.unshift(item);
  else if(action==="update") S.items=S.items.map(x=>x.id===item.id?item:x);
  else if(action==="delete") S.items=S.items.filter(x=>x.id!==item.id);
  setCached(S.items); render();
  if(!S.cfg.api) return;
  try{ await api(action,item); S.online=true; }
  catch(e){ S.queue.push({action,payload:item}); save("queue",S.queue); S.online=false; toast("圏外のため後で送り申す"); }
}

// 古い形（contrib を直に持っていた頃）で保存されていたら、base/ratio/extra に均す。
function normPlan(p){
  if(!p) return {from:"2000-01",base:0,ratio:0.5,extra:{r:0,m:0},fixed:[]};
  if(p.base==null){
    const c=p.contrib||{r:0,m:0}, base=250000, ratio=Number(p.ratio)||0.5;
    p.base=base;
    p.extra={ r:Math.max(0,(Number(c.r)||0)-base*ratio), m:Math.max(0,(Number(c.m)||0)-base*(1-ratio)) };
  }
  p.extra=p.extra||{r:0,m:0};
  p.base=Number(p.base)||0; p.ratio=Number(p.ratio)||0;
  return p;
}
function contribOf(p){
  return { r: Math.round(p.base*p.ratio)+(Number(p.extra.r)||0),
           m: Math.round(p.base*(1-p.ratio))+(Number(p.extra.m)||0) };
}
function planFor(m){
  const ps=(S.cfg.plans||[]).map(normPlan).sort((a,b)=>a.from.localeCompare(b.from));
  let cur=ps[0]||normPlan(null);
  for(const p of ps) if(p.from<=m) cur=p;
  return cur;
}

function fixedFor(m){
  return (planFor(m).fixed||[]).filter(f=>f.on!==false).map(f=>({
    id:"fixed:"+m+":"+f.name, date:m+"-01", cat:f.cat||"住居",
    amount:Number(f.amount)||0, payer:f.payer||"c", burden:f.burden||"share",
    shop:f.name, memo:"固定費", fixed:true
  }));
}

/* ---------- 集計と精算 ---------- */

/**
 * 二つの時計（2026-08-19 上様の指図により追加）
 *
 * この帳面は月を二通りに数える。**混ぜてはならぬ。**
 *
 *   利用月 (`date` の月)  … 「その月にいくら使ったか」を見るための月
 *   引落月 (`pay`)        … 「共有口座からいつ出ていくか」＝振り込むべき月
 *
 * 共有カードは使った日と引き落とされる日がひと月ずれる（7月利用 → 8月26日引落）。
 * ゆえに取り込んだ明細には、明細ごとの引落月を `pay` として持たせる。
 * 現金や各自のキャッシュレスの立替は、その月のうちに精算するので `pay` は使った月と同じ。
 */
/* ⚠ 引落月は「2026-08」の文字列のはずだが、**スプレッドシートを一度往復すると化ける。**
   Googleスプレッドシートは "2026-08" を日付と解して勝手に Date に直してしまうため、
   GASから返ってくるときには "Sat Aug 01 2026 00:00:00 GMT+0900 (JST)" になっている。
   （2026-08-20 に踏んだ ―― 明細を取り込んだのに「1件もござらぬ」と警告が出続けた正体がこれ）
   GAS側でも直したが、**すでにシートへ日付として書かれてしまった行**があるので、
   受け取る側でも必ず yyyy-MM へ均す。時差でひと月ずれぬよう、文字列のまま読むこと。 */
const MONNM = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function normYM(v){
  if(!v) return "";
  const s=String(v).trim();
  let g=s.match(/^(\d{4})[-\/.年](\d{1,2})/);                       // 2026-08 / 2026/08/01 / 2026年8月
  if(g) return g[1]+"-"+String(Number(g[2])).padStart(2,"0");
  g=s.match(/\b([A-Za-z]{3})[a-z]*\s+\d{1,2}\s+(\d{4})\b/);       // Sat Aug 01 2026 …（Dateの文字列）
  if(g && MONNM[g[1].toLowerCase()]) return g[2]+"-"+String(MONNM[g[1].toLowerCase()]).padStart(2,"0");
  return "";
}
function payOf(x){ return normYM(x.pay) || String(x.date||"").slice(0,7); }
/* 引落月が抜け落ちたまま入っている、取り込み済みの共有カード明細。
   ―― GAS側が古いまま（引落月の列を知らぬ版）で動いていると、送っても K列に残らず、
      取り込んだはずの月に「明細が1件もござらぬ」と鳴り続ける。設定から振り直せるようにした。 */
function needPay(){
  return S.items.filter(x => x.payer==="c" && !x.fixed && x.src==="CSV"
    && !normYM(x.pay) && String(x.date||"").length>=7);
}
function monthItems(m){ return S.items.filter(x=>String(x.date||"").slice(0,7)===m); }
function payItems(m){ return S.items.filter(x=>payOf(x)===m); }

/**
 * 精算の考え方（2026-08-18 上様の指図により改訂）
 *
 * 按分比が効くのは **毎月の固定額（二人合わせて 25万）だけ**。
 * そこから足が出た共有の支払いは **折半**。
 *
 *   共有の支出 S に対し、はみ出し E = max(0, S − 固定額)
 *   受け持ち  = 固定額の按分ぶん + E/2
 *
 * その人が出した額 = 上乗せ（按分の外で入れている保険ぶんなど）
 *                  + 自分の財布で払った共有のもの（立替）
 *                  − 共有カードで払った自分個人のもの（持ち出し）
 *   ※ 按分ぶんの固定額は受け持ちと打ち消し合うので出てこない。
 *
 *   二人のあいだで動く額 = （諒の出し − 万貴の出し）÷ 2      ← 折半なので単純な半分
 *
 * この式なら、貸し借りが無い月は必ず 0 になる。
 * 保険のように「上乗せして入れ、共有カードで自分の分を払う」ものも、
 * 上乗せと持ち出しが打ち消し合ってちょうど 0 になる。
 */
/* 精算の勘定そのもの。渡された一覧に対して同じ算を行う。
   `summary()` は利用月の一覧を、`transfer()` は引落月の一覧を渡す。 */
function calcOn(m, list){
  const plan = planFor(m);
  const amt = x => Number(x.amount)||0;

  const total = list.reduce((a,b)=>a+amt(b),0);
  const shared = list.filter(x=>x.burden==="share").reduce((a,b)=>a+amt(b),0);

  const paidBy = k => list.filter(x=>x.payer===k).reduce((a,b)=>a+amt(b),0);
  const lent   = k => list.filter(x=>x.payer===k && x.burden==="share").reduce((a,b)=>a+amt(b),0);
  const took   = k => list.filter(x=>x.payer==="c" && x.burden===k).reduce((a,b)=>a+amt(b),0);
  const personal = k => list.filter(x=>x.burden===k).reduce((a,b)=>a+amt(b),0);

  const ratio = Number(plan.ratio);
  const contrib = contribOf(plan);
  const extra = {r:Number(plan.extra.r)||0, m:Number(plan.extra.m)||0};
  const lend = {r:lent("r"), m:lent("m")};
  const take = {r:took("r"), m:took("m")};
  const over = Math.max(0, shared - plan.base);              // 固定額から足が出たぶん
  const put  = {r:extra.r+lend.r-take.r, m:extra.m+lend.m-take.m};
  const settle = (put.r-put.m)/2;                            // 折半。正 = 万貴 → 諒
  /* 共有の支払いが固定額（25万）に届かぬ月は、按分の元を**実額まで下げる**（2026-08-19）。
     下げずに 25万 をそのまま按分すると、受け持ちが口座から出ていく額を上回り、
     余りがまるごともう一方へ寄って「諒 120,000／万貴 13,330」のような歪んだ額が出る。
     ―― 明細を取り込む前はどの月も家賃だけになるゆえ、必ずこれを踏む。
     足が出ている月は cap＝25万ゆえ、これまでと1円も変わらぬ。 */
  const cap  = Math.min(shared, plan.base);
  const due = { r: cap*ratio + over/2, m: cap*(1-ratio) + over/2 };

  const byCat = {};
  list.forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+amt(x); });

  /* 上乗せに見合う「共有カード払い・個人負担」がこの月にまだ無いぶん。
     ⚠ ここが残っていると、貸し借りが無くても精算額が出る。明細をまだ取り込んでいない月の印。 */
  const gap = {r:Math.max(0,extra.r-take.r), m:Math.max(0,extra.m-take.m)};
  return {plan,list,total,shared,ratio,base:plan.base,cap,contrib,extra,lend,take,over,put,settle,due,byCat,gap,
          paid:{c:paidBy("c"),r:paidBy("r"),m:paidBy("m")},
          personal:{r:personal("r"),m:personal("m")}};
}

/* 利用月で見た姿 ―― 「その月にいくら使ったか」 */
function summary(m){ return calcOn(m, monthItems(m).concat(fixedFor(m))); }

/**
 * 引落月で見た姿 ―― 「その月、共有口座へいくら振り込むか」（2026-08-19 追加）
 *
 * 共有口座から出ていくのは **その月に引き落とされるカードの請求（個人の買い物も含む全額）＋ 家賃。**
 * 個人の買い物も口座からは出ていくので、その人が自分で埋めねばならぬ。
 *
 *   振込額 = 共有の受け持ち（25万の按分＋はみ出しの折半）
 *          + 自分が共有カードで買った個人のもの（持ち出し）
 *          − 自分の財布から出した共有のもの（立替。もう払っているぶん）
 *
 * 二人の振込額を足すと、口座から出ていく額にちょうど一致する（`out` で確かめている）。
 */
function transfer(m){
  const c = calcOn(m, payItems(m).concat(fixedFor(m)));
  const out = c.shared - c.lend.r - c.lend.m + c.take.r + c.take.m;   // 口座から実際に出ていく額
  /* ⚠ はみ出しの折半で半円が出る。振込に小数は使えぬゆえ、
     諒のぶんを円に丸め、**残りをまるごと万貴のぶんにする。**
     こうしないと、両方を丸めたときに合計が口座から出る額と1円ずれる。 */
  const sr = Math.round(c.due.r + c.take.r - c.lend.r);
  const send = { r: sr, m: Math.round(out) - sr };

  /* この月に共有カードから引き落とされる請求の内訳（2026-08-19 上様の求めにより追加）。
     家賃は共有口座から出るがカード払いではないゆえ、fixed を除いて数える。
     除かねば「カードのご請求」に家賃が紛れ込み、Vpassの請求額と合わなくなる。 */
  const amt2 = x => Number(x.amount)||0;
  const isCard = x => x.payer==="c" && !x.fixed;
  const sum = f => c.list.filter(f).reduce((a,b)=>a+amt2(b),0);
  const bill = {
    total: sum(isCard),
    share: sum(x=>isCard(x)&&x.burden==="share"),
    r:     sum(x=>isCard(x)&&x.burden==="r"),
    m:     sum(x=>isCard(x)&&x.burden==="m"),
    n:     c.list.filter(isCard).length,
    other: sum(x=>x.payer==="c"&&x.fixed)
  };
  return Object.assign(c, {send, out, bill, diff: (send.r+send.m) - Math.round(out)});
}

/* 明細CSVの店名は全角英数（ＡＭＡＺＯＮ・Ｓｕｉｃａ・ＪＲ）。辞書は半角で書きたい。
   ⚠ 両方を半角へ畳んでから照らすこと。畳まずに toLowerCase だけで比べると、
     半角で書いた語（Amazon・JR）は全角の店名に一件も当たらず、辞書が黙って死ぬ。 */
function fold(s){
  return String(s||"").replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\s\u3000]/g,"").toLowerCase();
}
function guessCat(shop){
  if(!shop) return "";
  const s=fold(shop);
  for(const d of (S.cfg.dict||[])) if(d.kw && s.includes(fold(d.kw))) return d.cat;
  return "";
}

/* 共有カードの明細を取り込むとき、個人の負担へ倒すべき店を見分ける。
   ⚠ `guessCat` と同じく上から順・最初に当たったものを採る。 */
function guessMine(shop){
  if(!shop) return "";
  const s=fold(shop);
  for(const d of (S.cfg.mine||[])) if(d.kw && s.includes(fold(d.kw))) return d.who;
  return "";
}

/* ---------- 重複判定 ----------
   レシートとカード明細から同じ買い物が二度入るのを防ぐ。
   金額が一致し、日付が3日以内で、店名が寄っていれば同じものと見立てる。 */

function normShop(s){
  return String(s||"")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s\-‐－―ー・（）()株式会社有限会社店]/g,"")
    .toLowerCase();
}
function dayDiff(a,b){
  const t=s=>new Date(s+"T00:00:00").getTime();
  return Math.abs(t(a)-t(b))/86400000;
}
function findDup(it, list){
  const n=normShop(it.shop);
  return list.find(x=>{
    if(x.id===it.id || x.fixed) return false;
    if(Number(x.amount)!==Number(it.amount)) return false;
    if(dayDiff(x.date,it.date)>3) return false;
    const m=normShop(x.shop);
    if(!n || !m) return true;                       // どちらかに店名が無ければ金額と日付で判じる
    return n===m || n.includes(m) || m.includes(n);
  }) || null;
}

/* 「今月、共有口座へいくら振り込むか」の札（2026-08-19 追加）
   ⚠ ここだけは**引落月**で数える。まとめの他の数字は利用月ゆえ、額は一致しない。それが正しい。 */
/* 上乗せの見張り。⚠ **引落月で見ること。**
   利用月で見ると、カードの利用日と引落月がずれている当月はいつも鳴ってしまう。 */
function gapWarn(m){
  const t=transfer(m);
  if(!(t.gap.r||t.gap.m)) return "";
  /* ⚠ 引落月が抜けているだけで、明細そのものは入っている月では黙る。
     billCard() が「引落月を振り直してくだされ」と告げるゆえ、ここで重ねて
     「まだ取り込んでおらぬ」と言うと、取り込んだ上様を惑わせる（2026-08-20 に実際そうなった）。 */
  if(needPay().some(x=>shiftMonth(String(x.date).slice(0,7),1)===m)) return "";
  return `<div class="warnbox">上乗せに見合う<b>共有カード払いの個人負担</b>が、
    ${ymLabel(m)}引落のぶんにまだ ${yen(t.gap.r||t.gap.m)} 足りており申さぬ。
    <b>この月に引き落とされる明細をまだ取り込んでおらぬ</b>と見え申す。
    このままでは振込額が ${yen((t.gap.r+t.gap.m)/2)} ずれ申すゆえ、設定 → カード明細CSV から取り込んでくだされ。</div>`;
}

/* 「この月、共有カードからいくら引き落とされるか」の札（2026-08-19 追加）
   ⚠ **引落月**で数える。まとめの他の数字は利用月ゆえ、額は一致せぬ。それが正しい。 */
function billCard(m){
  const t=transfer(m), N=S.cfg.names;
  if(!t.bill.n){
    return `<div class="warnbox">${ymLabel(m)}26日に引き落とされる<b>カード明細がまだ1件もござらぬ。</b>
      共有カードは使った月の翌月に引き落とされ申すゆえ、${ymLabel(shiftMonth(m,-1))}利用ぶんの明細を
      設定 → カード明細CSV から取り込んでくだされ。取り込むまで振込額は出せ申さぬ。
      ${needPay().some(x=>shiftMonth(String(x.date).slice(0,7),1)===m)
        ? `<br><br><b>いや、取り込みは済んでおり申す。</b>ただ、その明細に<b>引落月が入っており申さぬ。</b>
           設定 → <b>引落月の振り直し</b> から当て直してくだされ。` : ""}</div>`;
  }
  const b=t.bill;
  const chip=(lbl,v)=>v>0?`<span class="chip num">${esc(lbl)} ${yenPlain(v)}</span>`:"";
  return `<div class="bill">
    <div class="hd"><span class="ic">💳</span><div class="lbl">${ymLabel(m)}26日 引き落とし ―― 共有カードのご請求</div></div>
    <div class="big num">${yen(b.total)}</div>
    <div class="brk">${chip("共有",b.share)}${chip(N.r,b.r)}${chip(N.m,b.m)}<span class="chip num">${b.n}件</span></div>
    <div class="memo num">これに家賃ほか ${yen(b.other)} を足した <b>${yen(t.out)}</b> が、この日に共有口座から出ていき申す。</div>
  </div>`;
}

function sendCard(m){
  const t=transfer(m), N=S.cfg.names;
  /* ⚠ その月に引き落とされるカード明細が1件も無いなら、まだ取り込んでおらぬ月。
     家賃だけで按分すると嘘の額（歪んだ片寄り）が出るゆえ、**黙って見せぬ。**
     代わりに billCard() が「取り込んでくだされ」と告げる。 */
  if(!t.list.length || !t.bill.n) return "";
  const one=(k)=>`<div><div class="who">${esc(N[k])}</div><div class="amt num">${yen(Math.max(0,t.send[k]))}</div></div>`;
  const back=(k)=>t.send[k]<0 ? `${esc(N[k])}は ${yen(-t.send[k])} 受け取る側にござる。` : "";
  return `<div class="send">
    <div class="hd"><span class="ic">🏦</span><div class="lbl">${ymLabel(m)}26日までに 共有口座へ振り込む額</div></div>
    <div class="two">${one("r")}${one("m")}</div>
    <div class="memo num">口座から出ていくのは ${yen(t.out)}
      ―― この月に引き落とされるカードと家賃。二人の振込を足すとちょうど同じ額になり申す。
      ${back("r")}${back("m")}</div>
  </div>`;
}

/* ---------- シート ---------- */

let sheetCtx=null;

function openSheet(html, ctx){
  sheetCtx=ctx||null;
  document.getElementById("sheetin").innerHTML=html;
  document.getElementById("sheet").classList.add("open");
  document.getElementById("sheetbg").classList.add("open");
  bindSheet();
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("sheetbg").classList.remove("open");
  sheetCtx=null;
}
function sheetShell(title, body){
  return `<div class="grab"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="xbtn" data-close="1">✕</button></div>${body}`;
}
function chipRow(id, items, cur, key){
  return `<div class="trio" id="${id}">${items.map(o=>`
    <button class="chip ${cur===o.k?"on":""}" data-${key}="${o.k}"
      style="${cur===o.k?chipStyle(o.cls):""}">${esc(o.label)}</button>`).join("")}</div>`;
}
function chipStyle(cls){
  const map={c:"--purple",r:"--teal",m:"--pink"};
  return `background:var(${map[cls]}-bg);color:var(${map[cls]}-ink)`;
}

function editorHTML(it, dupWarn){
  return sheetShell(it.id?"記録を直す":"記録する", `
    ${dupWarn||""}
    <div class="amtbox"><input id="f-amt" type="tel" inputmode="numeric" placeholder="0" value="${it.amount?yenPlain(it.amount):""}"></div>
    <div class="flabel">費目</div>
    <div class="chips" id="f-cats">${CATS.map(c=>`
      <button class="chip ${it.cat===c.k?"on":""}" data-cat="${esc(c.k)}"
        style="${it.cat===c.k?`background:var(${CVAR[c.c]}-bg);color:var(${CVAR[c.c]}-ink)`:""}">${c.ic} ${esc(c.k)}</button>`).join("")}</div>
    <div class="flabel">どこから払ったか</div>
    ${chipRow("f-payer", PAYERS(), it.payer, "payer")}
    <div class="flabel">誰の分か <span class="hint">共有カードで個人のものを買ったら、ここを個人に</span></div>
    ${chipRow("f-burden", BURDENS(), it.burden, "burden")}
    <div class="field"><label>店・内容</label><input id="f-shop" value="${esc(it.shop||"")}" placeholder="マルエツ"></div>
    <div class="field"><label>日付</label><input id="f-date" type="date" value="${esc(it.date||today())}"></div>
    <div class="field"><label>引落月 <span class="hint">共有口座から出ていく月。カードは利用のひと月あと</span></label>
      <input id="f-pay" type="month" value="${esc(payOf(it))}"></div>
    <div class="field"><label>メモ</label><textarea id="f-memo" rows="1" placeholder="なくてもよい">${esc(it.memo||"")}</textarea></div>
    <button class="save" id="f-save">保存する</button>
    ${it.id?'<button class="save del" id="f-del">この記録を消す</button>':""}

}

function openEditor(item, extra){
  const it = item || {id:"",date:today(),cat:"食費",amount:0,payer:"c",burden:"share",shop:"",memo:""};
  openSheet(editorHTML(it, extra&&extra.warn), {kind:"edit", it:Object.assign({},it), src:extra&&extra.src});
  setTimeout(()=>{ const a=document.getElementById("f-amt"); if(!it.id&&!it.amount&&a) a.focus(); },320);
}

function bindSheet(){
  const root=document.getElementById("sheetin");
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);

  const amt=root.querySelector("#f-amt");
  if(amt) amt.oninput=()=>{
    const n=amt.value.replace(/[^0-9]/g,"");
    amt.value = n?Number(n).toLocaleString("ja-JP"):"";
  };

  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    sheetCtx.it.cat=b.dataset.cat;
    root.querySelectorAll("[data-cat]").forEach(x=>{
      const on=x.dataset.cat===sheetCtx.it.cat, c=catOf(x.dataset.cat);
      x.classList.toggle("on",on);
      x.style.cssText = on?`background:var(${CVAR[c.c]}-bg);color:var(${CVAR[c.c]}-ink)`:"";
    });
  });

  const pickRow=(sel,key,items)=>root.querySelectorAll(`[data-${key}]`).forEach(b=>b.onclick=()=>{
    sheetCtx.it[key]=b.dataset[key];
    root.querySelectorAll(`[data-${key}]`).forEach(x=>{
      const on=x.dataset[key]===sheetCtx.it[key];
      x.classList.toggle("on",on);
      x.style.cssText = on?chipStyle((items.find(o=>o.k===x.dataset[key])||{}).cls):"";
    });
  });
  if(root.querySelector("#f-payer")){ pickRow("#f-payer","payer",PAYERS()); pickRow("#f-burden","burden",BURDENS()); }

  const shop=root.querySelector("#f-shop");
  if(shop) shop.onblur=()=>{
    const g=guessCat(shop.value);
    if(g && g!==sheetCtx.it.cat){
      const btn=root.querySelector(`[data-cat="${CSS.escape(g)}"]`);
      if(btn){ btn.click(); toast(g+" と見立て申した"); }
    }
  };

  const sv=root.querySelector("#f-save");
  if(sv) sv.onclick=async ()=>{
    const it=sheetCtx.it;
    const n=Number(String(root.querySelector("#f-amt").value).replace(/[^0-9]/g,""));
    if(!n){ toast("金額を入れてくだされ"); root.querySelector("#f-amt").focus(); return; }
    it.amount=n;
    it.shop=root.querySelector("#f-shop").value.trim();
    it.date=root.querySelector("#f-date").value||today();
    // 利用月と同じなら持たせない（既定に任せる）。ずれているときだけ刻む。
    const pv=(root.querySelector("#f-pay")||{}).value||"";
    it.pay = (pv && pv!==it.date.slice(0,7)) ? pv : undefined;
    it.memo=root.querySelector("#f-memo").value.trim();
    const isNew=!it.id;
    if(isNew){ it.id=uid(); it.src=sheetCtx.src||"手入力"; }
    closeSheet();
    await pushItem(isNew?"add":"update", it);
    if(it.shop && !guessCat(it.shop)) learnDict(it.shop, it.cat);
    toast(isNew?"入れ申した":"直し申した");
  };

  const dl=root.querySelector("#f-del");
  if(dl) dl.onclick=async ()=>{
    if(!confirm("この記録を消しまするか。")) return;
    const it=sheetCtx.it; closeSheet();
    await pushItem("delete", it); toast("消し申した");
  };

  bindConfigSheet(root);
  bindCsvSheet(root);
  bindReceiptSheet(root);
}

function learnDict(shop, cat){
  const kw=String(shop).trim();
  if(kw.length<2) return;
  S.cfg.dict.push({kw,cat}); save("cfg",S.cfg);
}

    const k=sheetCtx.kind;

    save("cfg",c); openConfig("plan"); render();

  const fpg=root.querySelector("#fp-go");
  if(fpg) fpg.onclick=async ()=>{
    const bad=needPay(); closeSheet();
    for(const x of bad) await pushItem("update", Object.assign({}, x,
      {pay: shiftMonth(String(x.date).slice(0,7), 1)}));
    render(); toast(bad.length+"件の引落月を振り直し申した");
  };

  const fxa=root.querySelector("#fx-add");
  if(fxa) fxa.onclick=()=>{

    (p.fixed=p.fixed||[]).push({name,amount:amt,cat:root.querySelector("#fx-cat").value,

    const p=c.plans.map(normPlan).find(x=>x.from===sheetCtx.from);

    c.mine.splice(Number(b.dataset.mndel),1); save("cfg",c); openConfig("mine");

// 写真は長辺1600pxまで縮める。原寸のままだと送るのに時間がかかり、読み取りの精度も上がらぬ。
function shrinkImage(file, maxEdge){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error("写真が読めず"));
    rd.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("写真が開けず"));
      img.onload=()=>{
        const sc=Math.min(1, maxEdge/Math.max(img.width,img.height));
        const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        const url=cv.toDataURL("image/jpeg",0.82);
        resolve({dataUrl:url, base64:url.split(",")[1]});
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}

/* ---------- CSV取り込み ---------- */

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===","){ row.push(cell); cell=""; }
      else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(ch!=="\r") cell+=ch;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

    `<option value="${i}" ${String(saved[sel])===String(i)?"selected":""}>${i+1}列目：${esc(String(head[i]||"").slice(0,12))}</option>`).join("");

      `<tr>${Array.from({length:width},(_,i)=>`<td>${esc(String(r[i]||"").slice(0,14))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="flabel">どの列が何か</div>
    <div class="maprow"><span class="mk">日付</span><select id="m-date">${colOpts("date")}</select></div>
    <div class="maprow"><span class="mk">店名</span><select id="m-shop">${colOpts("shop")}</select></div>

    <div class="flabel">いつ共有口座から引き落とされる分か</div>
    <div class="maprow"><span class="mk">引落月</span><input id="m-pay" type="month" value="${guessPay(rows)}"></div>
    <div class="note">明細に載っている<b>利用日</b>と、口座から<b>出ていく日</b>はひと月ずれ申す（毎月26日引落）。
    振込額はこの引落月で数え申すゆえ、ここを違えると振込が合わなくなり申す。
    <b>Vpassで開いていた「◯年◯月お支払い分」と同じ月</b>を選んでくだされ。</div>
    <div id="cv-prev"></div>
    <button class="save" id="cv-go">取り込む</button>`;

  const readMap=()=>({

    skip:Number(document.getElementById("m-skip").value),

  const refresh=()=>{
    const list=csvToItems(rows,readMap());
    const fresh=list.filter(x=>!findDup(x,S.items));
    const sum=fresh.reduce((a,b)=>a+b.amount,0);
    /* ⚠ 見張り ―― 取り込む行が、その月の固定費と同じものを指していないか。
       ジムや保険を固定費にも入れたままだと二重に数え、精算が狂う（2026-08-18 に踏んだ）。 */
    const clash=[]; const seen={};
    fresh.forEach(x=>{
      const m=String(x.date).slice(0,7);
      (seen[m]=seen[m]||fixedFor(m)).forEach(f=>{
        if(f.payer==="c" && Number(f.amount)===Number(x.amount) && !clash.some(v=>v.f===f.shop))
          clash.push({f:f.shop, s:x.shop});
      });
    });
    const mine=fresh.filter(x=>x.burden!=="share").length;
    document.getElementById("cv-prev").innerHTML = list.length
      ? `<div class="card" style="margin-top:14px">${fresh.slice(0,5).map(rowHTML).join("")||emptyHTML("新しいものは無し","")}</div>
         <div class="note num">読めたもの ${list.length} 件のうち、新しいものは <b>${fresh.length} 件・${yen(sum)}</b>。
         ${list.length-fresh.length?`残り ${list.length-fresh.length} 件はすでに入っており申す。`:""}
         ${mine?`<br>うち <b>${mine}件</b>は「個人の負担に倒す店」に当たったゆえ、自動で個人の負担にいたす。`:""}</div>
         ${clash.length?`<div class="warnbox">取り込む行と<b>同じ額の固定費</b>がござる ――
           ${clash.slice(0,4).map(v=>esc(v.f)+"（明細では「"+esc(v.s)+"」）").join("、")}。
           <b>二重に数えて精算が狂い申す。</b>設定 → 固定費 から、その固定費を外してくだされ。</div>`:""}`
      : `<div class="note">その組み合わせでは1件も読めており申さぬ。列か、飛ばす行を変えてくだされ。</div>`;
    document.getElementById("cv-go").disabled = !fresh.length;
  };
  ["m-date","m-shop","m-amt","m-skip","m-pay"].forEach(id=>document.getElementById(id).onchange=refresh);

  if(!S.cfg.csvMap) autoGuess();
  refresh();

  document.getElementById("cv-go").onclick=async ()=>{
    const map=readMap();
    // ⚠ 引落月は覚えない。覚えると次の取り込みに古い月が紛れ込む。列と飛ばす行だけ。
    S.cfg.csvMap={date:map.date, shop:map.shop, amt:map.amt, skip:map.skip}; save("cfg",S.cfg);
    const fresh=csvToItems(rows,map).filter(x=>!findDup(x,S.items));
    closeSheet();
    for(const it of fresh) await pushItem("add", it);
    toast(fresh.length+"件を取り込み申した");
  };

  function autoGuess(){
    const sample=rows.slice(0,12);
    let best={date:0, amt:width>1?width-1:0, shop:1}, dS=-1,aS=-1,sS=-1;
    for(let i=0;i<width;i++){
      let d=0,a=0,s=0;
      sample.forEach(r=>{
        const v=String(r[i]||"").trim(); if(!v) return;
        if(/^\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}/.test(v)) d++;
        if(/^[\-\d,]+$/.test(v) && v.replace(/[^0-9]/g,"").length>=2) a++;
        if(v.length>=3 && !/^[\d,\/\-]+$/.test(v)) s++;
      });
      if(d>dS){dS=d;best.date=i;} if(a>aS){aS=a;best.amt=i;} if(s>sS){sS=s;best.shop=i;}
    }
    document.getElementById("m-date").value=best.date;
    document.getElementById("m-amt").value=best.amt;
    document.getElementById("m-shop").value=best.shop;
    document.getElementById("m-skip").value = /^\d{4}/.test(String(rows[0][best.date]||""))?0:1;
  }
}


/* 明細のいちばん新しい利用日から、引き落とし月を当てる。
   月末締め・翌月26日払いゆえ「いちばん新しい利用日の翌月」。上様が画面で直せる。 */
function guessPay(rows){
  let mx="";
  rows.forEach(r=>r.forEach(v=>{
    const g=String(v||"").match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(g){ const s=g[1]+"-"+String(g[2]).padStart(2,"0")+"-"+String(g[3]).padStart(2,"0"); if(s>mx) mx=s; }
  }));
  return mx ? shiftMonth(mx.slice(0,7),1) : ym(new Date());
}
function csvToItems(rows,map){
  const out=[];
  rows.slice(map.skip).forEach(r=>{
    const m=String(r[map.date]||"").trim().match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(!m) return;
    const amt=Number(String(r[map.amt]||"").replace(/[^0-9\-]/g,""));
    if(!amt||amt<0) return;
    const shop=String(r[map.shop]||"").trim();
    out.push({ id:uid(),
      date:m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0"),
      cat:guessCat(shop)||"その他", amount:amt,
      payer:"c", burden:guessMine(shop)||"share", shop, memo:"", src:"CSV",
      pay: map.pay || undefined });
  });
  return out;
}

/* ---------- 繋ぎこみ ---------- */

function bindAll(){
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    S.month=shiftMonth(S.month,Number(b.dataset.mv)); render();
  });
  document.querySelectorAll("[data-edit]").forEach(r=>r.onclick=()=>{
    const it=S.items.find(x=>x.id===r.dataset.edit); if(it) openEditor(it);
  });
  document.querySelectorAll(".more[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.open;
    if(k==="csv") openCsv(); else if(k==="receipt") openReceipt(); else openConfig(k);
  });
  document.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>pullAll());
}

document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById("fab").onclick=()=>openEditor(null);
document.getElementById("sheetbg").onclick=closeSheet;

S.items=cached();
render();
pullAll();
window.addEventListener("online",()=>pullAll());

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
